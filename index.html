<title>Registro Giornate — W SERVICE</title>
<style>
  :root{
    --font-display: -apple-system, 'SF Pro Display', 'SF Pro Text', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-mono: -apple-system, 'SF Pro Display', 'SF Pro Text', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-body: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --paper:#F3F5FA;
    --card:#FFFFFF;
    --ink:#14223B;
    --ink-soft:#5B6880;
    --rule:#D9E0EC;
    --rule-soft:#E6EBF3;
    --credit:#2E6A4E;
    --credit-bg:#DDEBE3;
    --debit:#B23A2E;
    --debit-bg:#F6DEDA;
    --brass:#8A6414;
    --accent:#3E6BF0;
    --shadow:0 1px 2px rgba(20,34,59,.05), 0 8px 24px rgba(20,34,59,.06);
    --brass-bg:#F2E6C6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    min-height:100vh;
    padding-bottom:88px;
  }
  .wrap{max-width:520px;margin:0 auto;padding:0 16px;}

  header.top{
    padding:22px 16px 14px;
    max-width:520px;margin:0 auto;
    border-bottom:2px solid var(--ink);
  }
  header.top .eyebrow{
    font-family:var(--font-mono);
    font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-soft);
  }
  header.top h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:26px;
    margin:2px 0 0;
  }
  header.top .sub{
    font-family:var(--font-display);font-style:italic;
    color:var(--ink-soft);font-size:14px;margin-top:2px;
  }

  header.top{
    max-width:none; background:var(--ink);
    padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;
  }
  header.top .hin{ max-width:520px; margin:0 auto; display:flex; align-items:center; gap:14px; }
  header.top .hin img{ height:48px; width:auto; flex:none; }
  header.top .eyebrow{ color:#9FB0CC; }
  header.top h1{ color:#F0F4FA; font-size:24px; }
  header.top .sub{ color:#B7C4DB; }
  nav.tabbar{ padding-bottom:env(safe-area-inset-bottom,0px); }

  .cal-nav{ display:flex; align-items:center; justify-content:space-between; margin:6px 0 10px; }
  .cal-nav button{ background:var(--card); border:1px solid var(--rule); border-radius:5px; width:42px; height:36px; font-size:20px; color:var(--ink); cursor:pointer; }
  .cal-mese{ font-family:var(--font-display); font-weight:700; font-size:18px; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cal-dow{ text-align:center; font-family:var(--font-mono); font-size:10px; color:var(--ink-soft); padding:2px 0; }
  .cal-day{ position:relative; aspect-ratio:1/1; padding:0; background:var(--card); border:1px solid var(--rule-soft); border-radius:5px; font-family:var(--font-mono); font-size:14px; color:var(--ink); cursor:pointer; }
  .cal-day.today{ border-color:var(--brass); font-weight:700; }
  .cal-day.sel{ background:var(--ink); color:#F0F4FA; border-color:var(--ink); }

  .prog-note{ font-size:13px; color:var(--ink-soft); margin-top:6px; }
  .prog-tag{ font-family:var(--font-mono); font-size:10px; text-transform:uppercase; background:var(--credit-bg); color:var(--credit); padding:2px 6px; border-radius:8px; font-weight:400; }
  .chk-row{ display:flex; align-items:center; gap:8px; margin:6px 0; font-family:var(--font-body); font-size:15px; text-transform:none; letter-spacing:0; color:var(--ink); }
  .chk-row input{ width:18px; height:18px; flex:none; accent-color:var(--ink); }

  .totals-strip{ display:flex; flex-wrap:wrap; gap:10px; margin:14px 0 18px; }
  .tot-card{ flex:1 1 calc(50% - 5px); min-width:0; background:var(--card); border:1px solid var(--rule); border-radius:4px; padding:10px 12px; }
  .tot-card .lbl{ font-family:var(--font-mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); }
  .tot-card .val{ font-family:var(--font-mono); font-weight:700; font-size:16px; margin-top:3px; }
  .tot-card.credit .val{ color:var(--credit); }
  .tot-card.debit .val{ color:var(--debit); }
  .tot-card.margin .val{ color:var(--brass); }
  .sub-title{ font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); margin:14px 0 6px; }
  .tot-card.spese .val{ color:var(--ink); }
  .spese-sub{ font-family:var(--font-mono); font-size:10px; color:var(--ink-soft); margin-top:3px; }

  h2.section-title{

    margin:22px 0 10px; display:flex; align-items:baseline; gap:8px;
  }
  h2.section-title .count{ font-family:var(--font-mono); font-size:12px; color:var(--ink-soft); font-weight:400; }

  .card{ background:var(--card); border:1px solid var(--rule); border-radius:6px; padding:14px; margin-bottom:10px; }

  label{
    display:block; font-family:var(--font-mono); font-size:11px;
    letter-spacing:.05em; text-transform:uppercase; color:var(--ink-soft);

    background:#fff; color:var(--ink);

  input:focus,textarea:focus{ outline:2px solid var(--brass); outline-offset:1px; }
  textarea{ resize:vertical; min-height:50px; }

  .persona-group{ margin-bottom:10px; padding-bottom:6px; border-bottom:1px solid var(--rule-soft); }
  .persona-group:last-child{ border-bottom:none; }
  .persona-entry{
    display:flex; gap:8px; align-items:center;

  .persona-entry input[type=text]{ flex:1.4; }
  .persona-entry input[type=number]{ flex:1; text-align:right; font-family:var(--font-mono); }
  .persona-entry .rm-btn{
    flex:0 0 auto; background:none; border:none; color:var(--debit);

  }
  .persona-hint{
    font-family:var(--font-mono); font-size:11px; color:var(--ink-soft);
    text-align:right; margin-top:3px; min-height:14px;
  }
  .persona-hint .amt{ color:var(--debit); font-weight:600; }

  .persona-pagato{
    display:flex; align-items:center; justify-content:flex-end; gap:6px;

  .badge-pag{

  .badge-pag.fattura{ background:var(--credit-bg); color:var(--credit); }

  .pay-toggle{
    font-family:var(--font-mono); font-size:11px; padding:4px 9px;
    border-radius:12px; border:1px solid var(--rule); background:#fff;

  .pay-toggle.paid{ background:var(--credit-bg); border-color:var(--credit); color:var(--credit); }

  .btn-primary{

  .btn-secondary{
    width:100%; background:none; border:1.5px dashed var(--rule); color:var(--ink-soft);
    border-radius:6px; padding:11px; font-family:var(--font-mono); font-size:13px;
    margin-top:6px; cursor:pointer;
  }
  .btn-cancel{
    width:100%; background:none; border:1px solid var(--rule); color:var(--ink-soft);
    border-radius:6px; padding:11px; font-family:var(--font-mono); font-size:13px;
    margin-top:8px; cursor:pointer;
  }

  .msg-empty{
    font-family:var(--font-display); font-style:italic; color:var(--ink-soft);
    text-align:center; padding:30px 10px; font-size:15px;
  }

  .giorno-card{ background:var(--card); border:1px solid var(--rule); border-radius:6px; margin-bottom:10px; overflow:hidden; }
  .giorno-head{ display:flex; align-items:center; gap:12px; padding:12px 14px; cursor:pointer; }
  .giorno-day{ font-family:var(--font-mono); font-weight:700; font-size:12px; background:var(--ink); color:var(--card); border-radius:4px; padding:4px 7px; flex:0 0 auto; white-space:nowrap; }
  .giorno-info{ flex:1; min-width:0; }

  .giorno-info .meta{ font-family:var(--font-mono); font-size:11px; color:var(--ink-soft); margin-top:1px; }
  .giorno-amt{ text-align:right; flex:0 0 auto; }
  .giorno-amt .imp{ font-family:var(--font-mono); font-weight:700; font-size:15px; color:var(--credit); }
  .giorno-amt .margine{ font-family:var(--font-mono); font-size:11px; color:var(--brass); }
  .giorno-detail{ padding:0 14px 14px; border-top:1px dashed var(--rule); display:none; }

  .giorno-actions{ display:flex; gap:8px; margin-top:12px; }

  .btn-del{ background:var(--debit-bg); color:var(--debit); border:1px solid var(--debit); }
  .btn-edit{ background:var(--brass-bg); color:var(--brass); border:1px solid var(--brass); }

  .ledger-entity-head .en-name{ font-family:var(--font-display); font-weight:700; font-size:16px; }
  .ledger-entity-head .en-sub{ font-family:var(--font-mono); font-size:11px; color:var(--ink-soft); }
  .ledger-entity-head .en-amt{ font-family:var(--font-mono); font-weight:700; font-size:17px; }
  .en-amt.c{ color:var(--credit); }
  .en-amt.d{ color:var(--debit); }
  .en-amt.m{ color:var(--brass); }
  .ledger-entity-body{ padding:0 14px 12px; border-top:1px dashed var(--rule); display:none; }
  .ledger-entity-body.open{ display:block; }
  .ledger-entity-body .eline{ display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:12.5px; padding:7px 0; border-bottom:1px solid var(--rule-soft); color:var(--ink-soft); }
  .ledger-entity-body .eline:last-child{ border-bottom:none; }
  .ledger-entity-body .eline .d1{ color:var(--ink); }

  .filter-row{ margin-bottom:14px; }
  select{
    width:100%; font-family:var(--font-body); font-size:15px; padding:10px 11px;
    border:1px solid var(--rule); border-radius:5px; background:#fff; color:var(--ink);

    background-repeat:no-repeat; background-position:right 12px center; padding-right:32px;

  .view-toggle{ display:flex; gap:8px; margin-bottom:16px; }
  .view-toggle button{
    flex:1; font-family:var(--font-mono); font-size:12px; padding:10px 4px;
    border:1px solid var(--ink); border-radius:5px; background:none; color:var(--ink); cursor:pointer;
  }
  .view-toggle button.active{ background:var(--ink); color:var(--card); }

  nav.tabbar{
    position:fixed; bottom:0; left:0; right:0;

    display:flex; max-width:520px; margin:0 auto;
  }
  nav.tabbar button{
    flex:1; background:none; border:none; padding:11px 4px 9px;
    font-family:var(--font-mono); font-size:10.5px; letter-spacing:.02em;
    color:var(--ink-soft); cursor:pointer; display:flex; flex-direction:column;
    align-items:center; gap:3px; text-transform:uppercase;
  }
  nav.tabbar button .ic{ font-size:18px; }
  nav.tabbar button.active{ color:var(--ink); font-weight:700; }

  .toast{
    position:fixed; top:14px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--card); padding:9px 18px; border-radius:20px;
    font-family:var(--font-mono); font-size:12.5px; opacity:0;
    transition:opacity .25s; pointer-events:none; z-index:99; max-width:88%; text-align:center;
  }
  .toast.show{ opacity:1; }

  #error-banner{
    display:none;
    background:var(--debit-bg); border:1px solid var(--debit); color:var(--debit);

  }

  .az-edit{ display:grid; grid-template-columns:1fr 1.4fr 38px; gap:8px; margin-bottom:8px; align-items:center; }

<script>
"use strict";

var STORAGE_KEY = "wservice_registro_giornate_v2";
try{ if(navigator.storage && navigator.storage.persist){ navigator.storage.persist(); } }catch(e){}
var BACKUP_KEY = "wservice_ultimo_backup";
var giornate = [];
var storageOk = true;

function loadData(){
  try{
    var raw = window.localStorage.getItem(STORAGE_KEY);
    if(raw){ giornate = JSON.parse(raw) || []; }
  }catch(e){
    storageOk = false;
    console.warn("Salvataggio locale non disponibile:", e);
  }
}
function saveData(){
  try{
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify(giornate));
  }catch(e){
    storageOk = false;
    console.warn("Impossibile salvare:", e);
    showToast("Attenzione: impossibile salvare i dati su questo dispositivo");
  }
  cloudPush();
}

/* ---------------- SALVATAGGIO NEL CLOUD (account Claude) ---------------- */
var cloud = null, cloudYears = {}, cloudTimer = null, cloudWarned = false;

function cloudYear(g){ return String(g.data||"").slice(0,4) || "0000"; }

function cloudPush(){
  if(!cloud) return;
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(function(){
    var perAnno = {};
    giornate.forEach(function(g){
      var y = cloudYear(g);
      (perAnno[y] = perAnno[y] || []).push(g);
    });
    Object.keys(cloudYears).forEach(function(y){ if(!perAnno[y]) perAnno[y] = []; });
    var jobs = Object.keys(perAnno).map(function(y){
      cloudYears[y] = true;
      return cloud.doc("anno-" + y).set({ giornate: perAnno[y] });
    });
    Promise.all(jobs).catch(function(e){
      console.warn("Cloud non raggiungibile:", e);
      if(!cloudWarned){ cloudWarned = true; showToast("Salvato solo su questo telefono (cloud non raggiungibile)"); }
    });
  }, 500);
}

function cloudInit(){
  if(!window.claude || !window.claude.use) return;
  Promise.all([window.claude.use("db"), window.claude.use("user")]).then(function(r){
    var db = r[0], user = r[1];
    if(!db || !user) return null;
    return user.id().then(function(id){
      if(!id) return null;
      var col = db.collection("data/users/" + id);
      return col.get().then(function(snap){
        cloud = col;
        if(snap.empty){
          if(giornate.length){ cloudPush(); showToast("Dati copiati nel cloud \u2713"); }
          return;
        }
        var remote = [];
        snap.docs.forEach(function(d){
          var dat = d.data() || {};
          cloudYears[d.id.replace("anno-","")] = true;
          (dat.giornate || []).forEach(function(g){ remote.push(g); });
        });
        giornate = remote;
        try{ window.localStorage.setItem(STORAGE_KEY, JSON.stringify(giornate)); }catch(e){}
        renderTab(CURRENT_TAB);
        showToast("Dati sincronizzati \u2713");
      });
    });
  }).catch(function(e){ console.warn("Cloud non disponibile:", e); });
}

var CURRENT_TAB = "calendario";
var editingId = null;
var formPersone = [{nome:"", costo:"", pagato:false}];
var formData = "";
var formCliente = "";
var formImporto = "";
var formNote = "";
var formCarb = "";
var formPasti = "";
var formPagamento = "";

var openGiornoId = null;
var RIEPILOGO_MESE = "tutti";
var openLedgerId = null;

var $content = document.getElementById("content");
var $totalsWrap = document.getElementById("totals-strip-wrap");

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function eur(n){
  n = n || 0;
  return (Math.round(n*100)/100).toLocaleString("it-IT",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function todayISO(){
  var d = new Date();
  var m = String(d.getMonth()+1).padStart(2,"0");
  var day = String(d.getDate()).padStart(2,"0");
  return d.getFullYear()+"-"+m+"-"+day;
}
function fmtDate(iso){
  var d = new Date(iso+"T00:00:00");
  return d.toLocaleDateString("it-IT",{day:"2-digit",month:"short",year:"numeric"});
}
function fmtDateShort(iso){
  var d = new Date(iso+"T00:00:00");
  return d.toLocaleDateString("it-IT",{day:"2-digit",month:"2-digit"});
}
function monthKey(iso){ return iso.slice(0,7); }
function monthLabel(key){
  var parts = key.split("-");
  var d = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, 1);
  var s = d.toLocaleDateString("it-IT",{month:"long",year:"numeric"});
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function showToast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(function(){ t.classList.remove("show"); }, 1800);
}

function showErrorBanner(msg){
  var b = document.getElementById("error-banner");
  if(!b) return;
  b.textContent = "Si e' verificato un problema: " + msg + " (tocca per chiudere)";
  b.style.display = "block";
}
function reportError(err){
  console.error(err);
  showErrorBanner(err && err.message ? err.message : String(err));
}
function on(el, evt, fn){
  if(!el){ reportError({message:"elemento mancante per evento " + evt}); return; }
  el.addEventListener(evt, function(e){
    try{ fn(e); }
    catch(err){ reportError(err); }
  });
}
function escapeHtml(s){
  s = (s===undefined || s===null) ? "" : String(s);
  return s.replace(/[&<>"']/g, function(m){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m];
  });
}

function giornoCosti(g){
  var tot = 0;
  (g.persone||[]).forEach(function(p){ tot += (p.costo||0); });
  return tot;
}
function giornoMargine(g){ return (g.importoCliente||0) - giornoCosti(g); }
function giornoSpese(g){ return g.spese || 0; }
function giornoNonPagato(g){
  var tot = 0;
  (g.persone||[]).forEach(function(p){ if(!p.pagato) tot += (p.costo||0); });
  return tot;
}
function pagamentoLabel(v){
  if(v==="cash") return "Cash";
  if(v==="fattura") return "Fattura";
  return "";
}

function listaClientiStorici(){
  var set = {};
  giornate.forEach(function(g){ if(g.cliente) set[g.cliente]=true; });
  return Object.keys(set).sort();
}
function listaPersoneStoriche(){
  var set = {};
  giornate.forEach(function(g){
    (g.persone||[]).forEach(function(p){ if(p.nome) set[p.nome]=true; });
  });
  return Object.keys(set).sort();
}

function totaliComplessiviHtml(){
  var totCredit = 0, totDebit = 0, totNonPagato = 0, totSpese = 0, totCarb = 0, totPasti = 0;
  giornate.forEach(function(g){
    totCredit += (g.importoCliente||0);
    totDebit += giornoCosti(g);
    totNonPagato += giornoNonPagato(g);
    totSpese += giornoSpese(g);
    totCarb += (g.carburante||0);
    totPasti += (g.pasti||0);
  });
  var margine = totCredit - totDebit;
  return '<div class="totals-strip">' +
      '<div class="tot-card credit"><div class="lbl">Da clienti</div><div class="val">&euro; ' + eur(totCredit) + '</div></div>' +
      '<div class="tot-card debit"><div class="lbl">Alla squadra</div><div class="val">&euro; ' + eur(totDebit) + '</div></div>' +
      '<div class="tot-card debit"><div class="lbl">Da pagare</div><div class="val">&euro; ' + eur(totNonPagato) + '</div></div>' +
      '<div class="tot-card margin"><div class="lbl">Margine</div><div class="val">&euro; ' + eur(margine) + '</div></div>' +
      '<div class="tot-card spese"><div class="lbl">Spese (a parte)</div><div class="val">&euro; ' + eur(totSpese) + '</div><div class="spese-sub">carburante &euro; ' + eur(totCarb) + ' &middot; pasti &euro; ' + eur(totPasti) + '</div></div>' +
    '</div>';
}
function renderTotalsStrip(){ $totalsWrap.innerHTML = ""; }

function personaTotaleStorico(nome){
  if(!nome) return 0;
  var key = nome.trim().toLowerCase();
  if(!key) return 0;
  var tot = 0;
  giornate.forEach(function(g){
    if(editingId && g.id===editingId) return;
    (g.persone||[]).forEach(function(p){
      if((p.nome||"").trim().toLowerCase()===key) tot += (p.costo||0);
    });
  });
  return tot;
}

/* ---------------- NUOVA GIORNATA ---------------- */
function resetForm(){
  editingId = null;
  formData = todayISO();
  formCliente = "";
  formImporto = "";
  formNote = "";
  formCarb = "";
  formPasti = "";
  formPagamento = "";
  formDaProgramma = null;
  formPersone = [{nome:"", costo:"", pagato:false}];
}

function loadGiornoIntoForm(g){
  editingId = g.id;
  formData = g.data;
  formCliente = g.cliente;
  formImporto = String(g.importoCliente);
  formNote = g.note || "";
  formCarb = g.carburante ? String(g.carburante) : "";
  formPasti = g.pasti ? String(g.pasti) : "";
  formPagamento = g.pagamentoCliente || "";
  formPersone = (g.persone||[]).map(function(p){ return {nome:p.nome, costo:String(p.costo), pagato:!!p.pagato}; });
  if(formPersone.length===0) formPersone = [{nome:"",costo:"",pagato:false}];
}

function updatePersonaHint(idx){
  var p = formPersone[idx];
  var hintEl = document.getElementById("hint-" + idx);
  if(!p || !hintEl) return;
  var storico = personaTotaleStorico(p.nome);
  var oggi = parseFloat(p.costo) || 0;
  if(!p.nome.trim()){
    hintEl.innerHTML = "";
  } else if(storico>0){
    hintEl.innerHTML = 'Gia\' maturato: &euro; ' + eur(storico) + ' &middot; con oggi: <span class="amt">&euro; ' + eur(storico+oggi) + '</span>';
  } else {
    hintEl.innerHTML = 'Prima giornata registrata per questa persona';
  }
}

function renderNuova(){
  var personeRows = formPersone.map(function(p, i){
    var storico = personaTotaleStorico(p.nome);
    var oggi = parseFloat(p.costo) || 0;
    var hintText = p.nome.trim()
      ? (storico>0
          ? 'Gia\' maturato: &euro; ' + eur(storico) + ' &middot; con oggi: <span class="amt">&euro; ' + eur(storico+oggi) + '</span>'
          : 'Prima giornata registrata per questa persona')
      : "";
    return '' +
      '<div class="persona-group">' +
        '<div class="persona-entry">' +
          '<input type="text" placeholder="Nome persona" autocomplete="off" autocapitalize="words" list="sq-list" data-idx="' + i + '" class="f-persona-nome" value="' + escapeHtml(p.nome) + '">' +
          '<input type="number" inputmode="decimal" step="0.01" placeholder="Costo &euro;" data-idx="' + i + '" class="f-persona-costo" value="' + escapeHtml(p.costo) + '">' +
          '<button class="rm-btn" data-rm="' + i + '" title="Rimuovi">&times;</button>' +
        '</div>' +
        '<label class="persona-pagato"><input type="checkbox" data-idx="' + i + '" class="f-persona-pagato"' + (p.pagato ? ' checked' : '') + '> Gi\u00e0 pagato</label>' +
        '<div class="persona-hint" id="hint-' + i + '">' + hintText + '</div>' +
      '</div>';
  }).join("");

  var editingBanner = editingId ? '<div class="editing-banner">Stai modificando una giornata esistente</div>' : "";

  $content.innerHTML =
    editingBanner +
    '<div class="card">' +
      '<label>Data</label>' +
      '<input type="date" id="f-data" value="' + formData + '">' +

      '<label>Cliente</label>' +
      '<input type="text" id="f-cliente" placeholder="Nome cliente" autocomplete="off" autocapitalize="words" value="' + escapeHtml(formCliente) + '">' +

      '<label>Importo pattuito con il cliente (&euro;)</label>' +
      '<input type="number" inputmode="decimal" step="0.01" id="f-importo" placeholder="0.00" value="' + escapeHtml(formImporto) + '">' +

      '<label>Come paga il cliente</label>' +
      '<select id="f-pagamento">' +
        '<option value=""' + (formPagamento===""?' selected':'') + '>Da definire</option>' +
        '<option value="cash"' + (formPagamento==="cash"?' selected':'') + '>Cash</option>' +
        '<option value="fattura"' + (formPagamento==="fattura"?' selected':'') + '>Fattura</option>' +
      '</select>' +

      '<label>Persone mandate a lavorare</label>' +
      '<div id="persone-rows">' + personeRows + '</div>' +
      '<datalist id="sq-list">' + squadra.map(function(n){ return '<option value="' + escapeHtml(n) + '">'; }).join("") + '</datalist>' +
      '<button class="btn-secondary" id="btn-add-row">+ Aggiungi persona</button>' +

      '<label>Carburante (&euro;) &middot; spesa fuori margine</label>' +
      '<input type="number" inputmode="decimal" step="0.01" id="f-carb" placeholder="0.00" value="' + escapeHtml(formCarb) + '">' +
      '<label>Pasti (&euro;) &middot; spesa fuori margine</label>' +
      '<input type="number" inputmode="decimal" step="0.01" id="f-pasti" placeholder="0.00" value="' + escapeHtml(formPasti) + '">' +

      '<label>Note (opzionale)</label>' +
      '<textarea id="f-note" placeholder="es. montaggio cucina, 2&deg; piano senza ascensore&hellip;">' + escapeHtml(formNote) + '</textarea>' +

      '<button class="btn-primary" id="btn-salva-giorno">' + (editingId ? "Aggiorna giornata" : "Registra giornata") + '</button>' +
      (editingId ? '<button class="btn-cancel" id="btn-annulla-edit">Annulla modifica</button>' : "") +
    '</div>';

  on(document.getElementById("f-data"), "input", function(e){ formData = e.target.value; });
  on(document.getElementById("f-cliente"), "input", function(e){ formCliente = e.target.value; });
  on(document.getElementById("f-importo"), "input", function(e){ formImporto = e.target.value; });
  on(document.getElementById("f-pagamento"), "change", function(e){ formPagamento = e.target.value; });
  on(document.getElementById("f-note"), "input", function(e){ formNote = e.target.value; });
  on(document.getElementById("f-carb"), "input", function(e){ formCarb = e.target.value; });
  on(document.getElementById("f-pasti"), "input", function(e){ formPasti = e.target.value; });

  document.querySelectorAll(".f-persona-nome").forEach(function(inp){
    on(inp, "input", function(){
      var idx = parseInt(inp.dataset.idx,10);
      formPersone[idx].nome = inp.value;
      updatePersonaHint(idx);
    });
  });
  document.querySelectorAll(".f-persona-costo").forEach(function(inp){
    on(inp, "input", function(){
      var idx = parseInt(inp.dataset.idx,10);
      formPersone[idx].costo = inp.value;
      updatePersonaHint(idx);
    });
  });
  document.querySelectorAll(".f-persona-pagato").forEach(function(inp){
    on(inp, "change", function(){
      var idx = parseInt(inp.dataset.idx,10);
      formPersone[idx].pagato = inp.checked;
    });
  });
  document.querySelectorAll("[data-rm]").forEach(function(btn){
    on(btn, "click", function(){
      var idx = parseInt(btn.dataset.rm,10);
      formPersone.splice(idx,1);
      if(formPersone.length===0) formPersone = [{nome:"",costo:""}];
      renderNuova();
    });
  });

  on(document.getElementById("btn-add-row"), "click", function(){
    formPersone.push({nome:"",costo:"",pagato:false});
    renderNuova();
    var rows = document.querySelectorAll(".f-persona-nome");
    if(rows.length) rows[rows.length-1].focus();
  });

  var cancelBtn = document.getElementById("btn-annulla-edit");
  if(cancelBtn){
    on(cancelBtn, "click", function(){
      resetForm();
      renderNuova();
    });
  }

  on(document.getElementById("btn-salva-giorno"), "click", function(){
    var cliente = (formCliente||"").trim();
    if(!cliente){ showToast("Inserisci il nome del cliente"); return; }
    var importo = parseFloat(formImporto);
    if(isNaN(importo)){ showToast("Inserisci l'importo del cliente"); return; }

    var persone = formPersone
      .map(function(p){ return {nome:(p.nome||"").trim(), costo: parseFloat(p.costo)||0, pagato: !!p.pagato}; })
      .filter(function(p){ return p.nome.length>0; });

    if(persone.length===0){ showToast("Aggiungi almeno una persona"); return; }

    if(editingId){
      var idx = giornate.findIndex(function(g){ return g.id===editingId; });
      if(idx>=0){
        giornate[idx] = {
          id: editingId,
          data: formData,
          cliente: cliente,
          importoCliente: importo,
          pagamentoCliente: formPagamento || "",
          carburante: parseFloat(formCarb) || 0,
          pasti: parseFloat(formPasti) || 0,
          spese: (parseFloat(formCarb) || 0) + (parseFloat(formPasti) || 0),
          note: formNote || "",
          persone: persone
        };
      }
      showToast("Giornata aggiornata \u2713");
    } else {
      giornate.push({
        id: uid(),
        data: formData,
        cliente: cliente,
        importoCliente: importo,
        pagamentoCliente: formPagamento || "",
          carburante: parseFloat(formCarb) || 0,
          pasti: parseFloat(formPasti) || 0,
          spese: (parseFloat(formCarb) || 0) + (parseFloat(formPasti) || 0),
        note: formNote || "",
        persone: persone
      });
      showToast("Giornata registrata \u2713");
      persone.forEach(function(p){ sqAggiungi(p.nome); });
      if(formDaProgramma){
        var pj = programma.find(function(x){ return x.id===formDaProgramma; });
        if(pj){ pj.fatto = true; saveProg(); }
        formDaProgramma = null;
      }
    }
    saveData();
    resetForm();
    renderNuova();
    renderTotalsStrip();
  });
}

/* ---------------- GIORNATE ---------------- */
function renderGiornate(){
  var lista = giornate.slice().sort(function(a,b){ return b.data.localeCompare(a.data); });
  if(lista.length===0){
    $content.innerHTML = '<h2 class="section-title">Giornate</h2><div class="msg-empty">Nessuna giornata registrata.<br>Vai su "Nuova" per iniziare il registro.</div>';
    return;
  }
  var html = '<h2 class="section-title">Giornate <span class="count">' + lista.length + ' totali</span></h2>';

  lista.forEach(function(g){
    var costi = giornoCosti(g);
    var margine = giornoMargine(g);
    var nonPagato = giornoNonPagato(g);
    var isOpen = openGiornoId === g.id;
    var nPersone = (g.persone||[]).length;
    var pagLbl = pagamentoLabel(g.pagamentoCliente);
    var detailRows = (g.persone||[]).map(function(p, pi){
      return '<div class="dline"><span>' + escapeHtml(p.nome) + '</span>' +
        '<span style="display:flex;align-items:center;gap:8px;">&euro; ' + eur(p.costo) +
        '<button class="pay-toggle ' + (p.pagato ? "paid" : "unpaid") + '" data-pay-giorno="' + g.id + '" data-pay-idx="' + pi + '">' + (p.pagato ? "Pagato" : "Da pagare") + '</button>' +
        '<button class="pay-rm" data-rmp-giorno="' + g.id + '" data-rmp-idx="' + pi + '" title="Togli dalla giornata">&times;</button>' +
        '</span></div>';
    }).join("");

    html +=
      '<div class="giorno-card">' +
        '<div class="giorno-head" data-id="' + g.id + '">' +
          '<div class="giorno-day">' + fmtDateShort(g.data) + '</div>' +
          '<div class="giorno-info">' +
            '<div class="cli">' + escapeHtml(g.cliente) + '</div>' +
            '<div class="meta">' + nPersone + (nPersone===1 ? ' persona' : ' persone') + ' &middot; ' + fmtDate(g.data) + '</div>' +
            (pagLbl ? '<div class="badge-pag ' + g.pagamentoCliente + '">' + pagLbl + '</div>' : '') +
          '</div>' +
          '<div class="giorno-amt">' +
            '<div class="imp">&euro; ' + eur(g.importoCliente) + '</div>' +
            '<div class="margine">margine &euro; ' + eur(margine) + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="giorno-detail ' + (isOpen ? "open" : "") + '">' +
          (g.note ? '<div style="font-family:var(--font-display);font-style:italic;font-size:13.5px;color:var(--ink-soft);margin:10px 0;">' + escapeHtml(g.note) + '</div>' : "") +
          detailRows +
          '<div class="dline" style="font-weight:700;color:var(--ink);"><span>Totale squadra</span><span>&euro; ' + eur(costi) + '</span></div>' +
          (nonPagato>0 ? '<div class="dline" style="font-weight:700;color:var(--debit);"><span>Ancora da pagare</span><span>&euro; ' + eur(nonPagato) + '</span></div>' : '') +
          (g.spese>0 ? '<div class="dline" style="color:var(--ink-soft);"><span>Spese fuori margine' + ((g.carburante||g.pasti) ? ' &middot; carburante &euro; ' + eur(g.carburante||0) + ' &middot; pasti &euro; ' + eur(g.pasti||0) : '') + '</span><span>&euro; ' + eur(g.spese) + '</span></div>' : '') +
          '<div class="giorno-actions">' +
            '<button class="btn-edit" data-edit="' + g.id + '">Modifica</button>' +
            '<button class="btn-del" data-del="' + g.id + '">Elimina</button>' +
          '</div>' +
        '</div>' +
      '</div>';
  });

  $content.innerHTML = html;

  document.querySelectorAll(".giorno-head").forEach(function(h){
    on(h, "click", function(){
      var id = h.dataset.id;
      openGiornoId = (openGiornoId===id) ? null : id;
      renderGiornate();
    });
  });
  document.querySelectorAll("[data-pay-giorno]").forEach(function(btn){
    on(btn, "click", function(e){
      e.stopPropagation();
      var gid = btn.dataset.payGiorno;
      var pidx = parseInt(btn.dataset.payIdx,10);
      var g = giornate.find(function(x){ return x.id===gid; });
      if(g && g.persone && g.persone[pidx]){
        g.persone[pidx].pagato = !g.persone[pidx].pagato;
        saveData();
        renderGiornate();
        renderTotalsStrip();
      }
    });
  });
  document.querySelectorAll("[data-rmp-giorno]").forEach(function(btn){
    on(btn, "click", function(e){
      e.stopPropagation();
      var g = giornate.find(function(x){ return x.id===btn.dataset.rmpGiorno; });
      var pidx = parseInt(btn.dataset.rmpIdx,10);
      if(!g || !g.persone || !g.persone[pidx]) return;
      if(!confirm("Togliere " + g.persone[pidx].nome + " da questa giornata?\n\nIl suo costo verrà tolto dai conti.")) return;
      g.persone.splice(pidx,1);
      saveData();
      renderGiornate();
      showToast("Persona tolta \u2713");
    });
  });
  document.querySelectorAll("[data-edit]").forEach(function(b){
    on(b, "click", function(e){
      e.stopPropagation();
      var id = b.dataset.edit;
      var g = giornate.find(function(x){ return x.id===id; });
      if(g){
        loadGiornoIntoForm(g);
        renderTab("nuova");
      }
    });
  });
  document.querySelectorAll("[data-del]").forEach(function(b){
    on(b, "click", function(e){
      e.stopPropagation();
      var id = b.dataset.del;
      if(confirm("Eliminare questa giornata dal registro?")){
        giornate = giornate.filter(function(g){ return g.id!==id; });
        saveData();
        showToast("Giornata eliminata");
        renderGiornate();
        renderTotalsStrip();
      }
    });
  });
}

/* ---------------- RIEPILOGO ---------------- */
function renderRiepilogo(){
  var backupSection =
    '<h2 class="section-title">Backup dati</h2>' +
    '<div class="card">' +
      '<div style="font-family:var(--font-body);font-size:13px;color:var(--ink-soft);margin-bottom:10px;">Scarica una copia di tutti i dati, o ripristinali da un backup precedente.</div>' +
      '<button class="btn-secondary" id="btn-export" style="margin-top:0;">&#8681; Esporta backup (.json)</button>' +
      '<button class="btn-secondary" id="btn-import">&#8679; Importa backup</button>' +
      '<input type="file" id="f-import-file" accept="application/json,.json" style="display:none;">' +
    '</div>';

  function wireBackupButtons(){
    on(document.getElementById("btn-export"), "click", function(){
      var payload = JSON.stringify({ giornate: giornate, programma: programma, azienda: azienda, squadra: squadra, esportato: new Date().toISOString() }, null, 2);
      var fname = "registro-giornate-backup-" + todayISO() + ".json";
      var ok = function(){
        try{ window.localStorage.setItem(BACKUP_KEY, todayISO()); }catch(e){}
        showToast("Backup salvato \u2713");
      };
      var scarica = function(){
        var blob = new Blob([payload], {type:"application/json"});
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url; a.download = fname;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
        ok();
      };
      try{
        var file = new File([payload], fname, {type:"application/json"});
        if(navigator.canShare && navigator.canShare({files:[file]})){
          navigator.share({files:[file], title:"Backup registro giornate"}).then(ok).catch(function(e){
            if(e && e.name!=="AbortError") scarica();
          });
          return;
        }
      }catch(e){}
      scarica();
    });

    on(document.getElementById("btn-import"), "click", function(){
      document.getElementById("f-import-file").click();
    });

    on(document.getElementById("f-import-file"), "change", function(e){
      var file = e.target.files && e.target.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(){
        try{
          var parsed = JSON.parse(reader.result);
          var imported = Array.isArray(parsed) ? parsed : parsed.giornate;
          if(!Array.isArray(imported)) throw new Error("Formato file non valido");
          var sostituisci = confirm("Importare " + imported.length + " giornate?\n\nOK = sostituisce tutti i dati attuali\nAnnulla = aggiunge questi dati a quelli esistenti");
          if(sostituisci){
            giornate = imported;
          } else {
            var existingIds = {};
            giornate.forEach(function(g){ existingIds[g.id] = true; });
            imported.forEach(function(g){
              if(!g.id || existingIds[g.id]) g.id = uid();
              giornate.push(g);
            });
          }
          if(!Array.isArray(parsed) && Array.isArray(parsed.programma)){
            if(sostituisci){ programma = parsed.programma; }
            else {
              var pid = {}; programma.forEach(function(x){ pid[x.id] = true; });
              parsed.programma.forEach(function(x){ if(!x.id || pid[x.id]) x.id = uid(); programma.push(x); });
            }
            saveProg();
          }
          if(!Array.isArray(parsed) && Array.isArray(parsed.squadra)){ parsed.squadra.forEach(function(n){ sqAggiungi(n); }); }
          if(!Array.isArray(parsed) && Array.isArray(parsed.azienda) && parsed.azienda.length){ azienda = parsed.azienda; saveAz(); }
          saveData();
          showToast("Backup importato \u2713");
          renderRiepilogo();
          renderTotalsStrip();
        }catch(err){
          reportError(err);
        }
        e.target.value = "";
      };
      reader.readAsText(file);
    });
  }

  if(giornate.length===0){
    $content.innerHTML =
      '<h2 class="section-title">Riepilogo</h2>' +
      '<div class="msg-empty">Registra qualche giornata per vedere il riepilogo.</div>' +
      backupSection;
    wireBackupButtons();
    return;
  }

  var mesiSet = {};
  giornate.forEach(function(g){ mesiSet[monthKey(g.data)] = true; });
  var mesi = Object.keys(mesiSet).sort().reverse();

  var filtered = RIEPILOGO_MESE==="tutti" ? giornate : giornate.filter(function(g){ return monthKey(g.data)===RIEPILOGO_MESE; });

  var meseOpts = '<option value="tutti"' + (RIEPILOGO_MESE==="tutti"?' selected':'') + '>Tutti i periodi</option>';
  mesi.forEach(function(m){
    meseOpts += '<option value="' + m + '"' + (RIEPILOGO_MESE===m?' selected':'') + '>' + monthLabel(m) + '</option>';
  });

  // Totali del periodo filtrato
  var periodoCredit = 0, periodoDebit = 0, periodoNonPagato = 0, periodoSpese = 0, periodoCarb = 0, periodoPasti = 0;
  filtered.forEach(function(g){ periodoCredit += (g.importoCliente||0); periodoDebit += giornoCosti(g); periodoNonPagato += giornoNonPagato(g); periodoSpese += giornoSpese(g); periodoCarb += (g.carburante||0); periodoPasti += (g.pasti||0); });
  var periodoMargine = periodoCredit - periodoDebit;

  var periodoStrip =
    '<div class="totals-strip" style="margin:0 0 20px;">' +
      '<div class="tot-card credit"><div class="lbl">Da clienti</div><div class="val">&euro; ' + eur(periodoCredit) + '</div></div>' +
      '<div class="tot-card debit"><div class="lbl">Alla squadra</div><div class="val">&euro; ' + eur(periodoDebit) + '</div></div>' +
      '<div class="tot-card debit"><div class="lbl">Da pagare</div><div class="val">&euro; ' + eur(periodoNonPagato) + '</div></div>' +
      '<div class="tot-card margin"><div class="lbl">Margine</div><div class="val">&euro; ' + eur(periodoMargine) + '</div></div>' +
      '<div class="tot-card spese"><div class="lbl">Spese (a parte)</div><div class="val">&euro; ' + eur(periodoSpese) + '</div><div class="spese-sub">carburante &euro; ' + eur(periodoCarb) + ' &middot; pasti &euro; ' + eur(periodoPasti) + '</div></div>' +
    '</div>';

  /* ---- SEZIONE CLIENTI ---- */
  var perCliente = {};
  filtered.forEach(function(g){
    if(!perCliente[g.cliente]) perCliente[g.cliente] = {tot:0, giornate:[]};
    perCliente[g.cliente].tot += (g.importoCliente||0);
    perCliente[g.cliente].giornate.push(g);
  });
  var nomiClienti = Object.keys(perCliente).sort();
  var clientiHtml = "";
  if(nomiClienti.length===0){
    clientiHtml = '<div class="msg-empty" style="padding:16px 0;">Nessun dato per questo periodo.</div>';
  } else {
    nomiClienti.forEach(function(nome){
      var info = perCliente[nome];
      var nPersoneGiorno = 0;
      info.giornate.forEach(function(g){ nPersoneGiorno += (g.persone||[]).length; });
      var righeGiorni = info.giornate.slice().sort(function(a,b){ return a.data.localeCompare(b.data); }).map(function(g){
        var nomiPersoneGiorno = (g.persone||[]).map(function(p){ return escapeHtml(p.nome); }).join(", ");
        var pagLblCli = pagamentoLabel(g.pagamentoCliente);
        return '<div class="eline"><span class="d1">' + fmtDateShort(g.data) + ' &middot; ' + (g.persone||[]).length + ' pers. (' + nomiPersoneGiorno + ')' + (pagLblCli ? ' &middot; ' + pagLblCli : '') + '</span><span>&euro; ' + eur(g.importoCliente) + '</span></div>';
      }).join("");
      clientiHtml +=
        '<div class="ledger-entity">' +
          '<div class="ledger-entity-head" style="cursor:default;">' +
            '<div><div class="en-name">' + escapeHtml(nome) + '</div>' +
            '<div class="en-sub">' + info.giornate.length + (info.giornate.length===1?' giornata':' giornate') + ' &middot; ' + nPersoneGiorno + ' persone-giorno</div></div>' +
            '<div class="en-amt c">&euro; ' + eur(info.tot) + '</div>' +
          '</div>' +
          '<div class="ledger-entity-body open">' + righeGiorni + '</div>' +
        '</div>';
    });
  }

  /* ---- SEZIONE PERSONE ---- */
  var perPersona = {};
  filtered.forEach(function(g){
    (g.persone||[]).forEach(function(p){
      if(!perPersona[p.nome]) perPersona[p.nome] = {tot:0, nonPagato:0, giornate:[]};
      perPersona[p.nome].tot += (p.costo||0);
      if(!p.pagato) perPersona[p.nome].nonPagato += (p.costo||0);
      perPersona[p.nome].giornate.push({data:g.data, cliente:g.cliente, costo:p.costo});
    });
  });
  var nomiPersone = Object.keys(perPersona).sort();
  var personeHtml = "";
  if(nomiPersone.length===0){
    personeHtml = '<div class="msg-empty" style="padding:16px 0;">Nessun dato per questo periodo.</div>';
  } else {
    nomiPersone.forEach(function(nome){
      var info = perPersona[nome];
      var perClientePersona = {};
      info.giornate.forEach(function(x){
        if(!perClientePersona[x.cliente]) perClientePersona[x.cliente] = {giorni:0, tot:0, date:[]};
        perClientePersona[x.cliente].giorni += 1;
        perClientePersona[x.cliente].tot += (x.costo||0);
        perClientePersona[x.cliente].date.push(x.data);
      });
      var nomiClientiPersona = Object.keys(perClientePersona).sort();
      var righeClienti = nomiClientiPersona.map(function(cli){
        var c = perClientePersona[cli];
        var dateStr = c.date.slice().sort().map(fmtDateShort).join(", ");
        return '<div class="eline"><span class="d1">' + escapeHtml(cli) + ' &middot; ' + c.giorni + (c.giorni===1?' giornata':' giornate') + ' (' + dateStr + ')</span><span>&euro; ' + eur(c.tot) + '</span></div>';
      }).join("");
      var subPagato = info.nonPagato>0
        ? ' &middot; <span style="color:var(--debit);">da pagare &euro; ' + eur(info.nonPagato) + '</span>'
        : ' &middot; <span style="color:var(--credit);">tutto pagato</span>';
      personeHtml +=
        '<div class="ledger-entity">' +
          '<div class="ledger-entity-head" style="cursor:default;">' +
            '<div><div class="en-name">' + escapeHtml(nome) + '</div>' +
            '<div class="en-sub">' + info.giornate.length + (info.giornate.length===1?' giornata lavorata':' giornate lavorate') + ' &middot; ' + nomiClientiPersona.length + (nomiClientiPersona.length===1?' cliente':' clienti') + subPagato + '</div></div>' +
            '<div class="en-amt d">&euro; ' + eur(info.tot) + '</div>' +
          '</div>' +
          '<div class="ledger-entity-body open">' + righeClienti + '</div>' +
        '</div>';
    });
  }

  /* ---- SEZIONE MARGINE ---- */
  var margineHtml = "";
  if(filtered.length===0){
    margineHtml = '<div class="msg-empty" style="padding:16px 0;">Nessun dato per questo periodo.</div>';
  } else {
    var righeMargine = filtered.slice().sort(function(a,b){ return a.data.localeCompare(b.data); }).map(function(g){
      var m = giornoMargine(g);
      return '<div class="eline"><span class="d1">' + fmtDateShort(g.data) + ' &middot; ' + escapeHtml(g.cliente) + '</span><span style="color:' + (m>=0?'var(--brass)':'var(--debit)') + ';font-weight:600;">&euro; ' + eur(m) + '</span></div>';
    }).join("");
    margineHtml =
      '<div class="ledger-entity">' +
        '<div class="ledger-entity-head" style="cursor:default;">' +
          '<div><div class="en-name">Margine per giornata</div><div class="en-sub">' + filtered.length + ' giornate nel periodo</div></div>' +
          '<div class="en-amt m">&euro; ' + eur(periodoMargine) + '</div>' +
        '</div>' +
        '<div class="ledger-entity-body open">' + righeMargine + '</div>' +
      '</div>';
  }

  $content.innerHTML =
    '<h2 class="section-title">Riepilogo</h2>' +
    '<div class="sub-title">Totale complessivo</div>' +
    totaliComplessiviHtml() +
    '<div class="sub-title">Periodo</div>' +
    '<div class="filter-row"><select id="f-mese">' + meseOpts + '</select></div>' +
    periodoStrip +
    '<h2 class="section-title">Da incassare &mdash; per cliente <span class="count">' + nomiClienti.length + '</span></h2>' +
    clientiHtml +
    '<h2 class="section-title">Da pagare &mdash; per persona <span class="count">' + nomiPersone.length + '</span></h2>' +
    personeHtml +
    '<h2 class="section-title">Margine &mdash; per giornata</h2>' +
    margineHtml +
    backupSection;

  on(document.getElementById("f-mese"), "change", function(e){ RIEPILOGO_MESE = e.target.value; renderRiepilogo(); });
  wireBackupButtons();
}

/* ---------------- CALENDARIO PROGRAMMAZIONE ---------------- */
var PROG_KEY = "wservice_programma_v1";
var programma = [];
var calMese = todayISO().slice(0,7);
var calGiorno = todayISO();
var progForm = null;
var formDaProgramma = null;
var MESI = ["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];

function loadProg(){ try{ var r = window.localStorage.getItem(PROG_KEY); if(r){ programma = JSON.parse(r) || []; } }catch(e){} }
function saveProg(){ try{ window.localStorage.setItem(PROG_KEY, JSON.stringify(programma)); }catch(e){ showToast("Impossibile salvare il calendario"); } }
function pad2(n){ return ("0"+n).slice(-2); }
function nomiNoti(){
  var m = {};
  giornate.forEach(function(g){ (g.persone||[]).forEach(function(p){ if(p.nome) m[p.nome] = 1; }); });
  programma.forEach(function(j){ (j.persone||[]).forEach(function(n){ m[n] = 1; }); });
  return Object.keys(m).sort();
}
function clientiNoti(){
  var m = {};
  giornate.forEach(function(g){ if(g.cliente) m[g.cliente] = 1; });
  programma.forEach(function(j){ if(j.cliente) m[j.cliente] = 1; });
  return Object.keys(m).sort();
}
function spostaMese(delta){
  var y = parseInt(calMese.slice(0,4),10), m = parseInt(calMese.slice(5,7),10)-1;
  var dt = new Date(y, m+delta, 1);
  calMese = dt.getFullYear() + "-" + pad2(dt.getMonth()+1);
  calGiorno = (calMese === todayISO().slice(0,7)) ? todayISO() : calMese + "-01";
  renderCalendario();
}

function renderCalendario(){
  if(progForm){ renderProgForm(); return; }
  var y = parseInt(calMese.slice(0,4),10), m = parseInt(calMese.slice(5,7),10)-1;
  var offset = (new Date(y,m,1).getDay()+6)%7;
  var nGiorni = new Date(y,m+1,0).getDate();
  var conta = {};
  programma.forEach(function(j){ if(!j.fatto) conta[j.data] = (conta[j.data]||0)+1; });
  var oggi = todayISO();
  var html = '<h2 class="section-title">Calendario</h2>' +
    '<div class="cal-nav"><button id="cal-prev">&lsaquo;</button><div class="cal-mese">' + MESI[m] + ' ' + y + '</div><button id="cal-next">&rsaquo;</button></div>' +
    '<div class="cal-grid">';
  ["L","M","M","G","V","S","D"].forEach(function(d){ html += '<div class="cal-dow">' + d + '</div>'; });
  for(var i=0;i<offset;i++){ html += '<div></div>'; }
  for(var d=1; d<=nGiorni; d++){
    var iso = calMese + "-" + pad2(d);
    var n = conta[iso];
    html += '<button class="cal-day' + (iso===calGiorno?' sel':'') + (iso===oggi?' today':'') + '" data-d="' + iso + '">' + d + (n ? '<span class="cal-dot">' + n + '</span>' : '') + '</button>';
  }
  html += '</div>';
  var jobs = programma.filter(function(j){ return j.data===calGiorno; }).sort(function(a,b){ return (a.ora||"").localeCompare(b.ora||""); });
  html += '<h2 class="section-title">' + fmtDate(calGiorno) + '</h2>';
  if(!jobs.length){ html += '<div class="msg-empty" style="padding:12px 0;">Nessun montaggio programmato.</div>'; }
  jobs.forEach(function(j){
    var pers = (j.persone||[]).map(function(n){ return escapeHtml(n); }).join(", ");
    html += '<div class="prog-card' + (j.fatto?' done':'') + '">' +
      '<div class="cli">' + (j.ora ? escapeHtml(j.ora) + ' &middot; ' : '') + escapeHtml(j.cliente) + (j.fatto ? ' <span class="prog-tag">registrato</span>' : '') + '</div>' +
      '<div class="meta">' + (pers || 'Nessuna persona assegnata') + '</div>' +
      (j.note ? '<div class="prog-note">' + escapeHtml(j.note) + '</div>' : '') +
      '<div class="giorno-actions">' +
        (j.fatto ? '' : '<button class="btn-edit" data-reg="' + j.id + '">Registra</button>') +
        '<button class="btn-edit" data-pedit="' + j.id + '">Modifica</button>' +
        '<button class="btn-del" data-pdel="' + j.id + '">Elimina</button>' +
      '</div></div>';
  });
  html += '<button class="btn-primary" id="cal-add">+ Programma montaggio</button>';
  $content.innerHTML = html;

  on(document.getElementById("cal-prev"), "click", function(){ spostaMese(-1); });
  on(document.getElementById("cal-next"), "click", function(){ spostaMese(1); });
  document.querySelectorAll(".cal-day").forEach(function(b){
    on(b, "click", function(){ calGiorno = b.dataset.d; renderCalendario(); });
  });
  on(document.getElementById("cal-add"), "click", function(){
    progForm = {id:null, data:calGiorno, ora:"", cliente:"", persone:[], note:"", fatto:false};
    renderCalendario();
  });
  function trova(id){ return programma.find(function(x){ return x.id===id; }); }
  document.querySelectorAll("[data-pedit]").forEach(function(b){
    on(b, "click", function(){
      var j = trova(b.dataset.pedit); if(!j) return;
      progForm = {id:j.id, data:j.data, ora:j.ora||"", cliente:j.cliente, persone:(j.persone||[]).slice(), note:j.note||"", fatto:!!j.fatto};
      renderCalendario();
    });
  });
  document.querySelectorAll("[data-pdel]").forEach(function(b){
    on(b, "click", function(){
      if(!confirm("Eliminare questo montaggio dal calendario?")) return;
      programma = programma.filter(function(x){ return x.id!==b.dataset.pdel; });
      saveProg(); renderCalendario();
    });
  });
  document.querySelectorAll("[data-reg]").forEach(function(b){
    on(b, "click", function(){
      var j = trova(b.dataset.reg); if(!j) return;
      editingId = null;
      formData = j.data; formCliente = j.cliente; formImporto = ""; formNote = j.note || ""; formCarb = ""; formPasti = ""; formPagamento = "";
      formPersone = (j.persone||[]).map(function(n){ return {nome:n, costo:"", pagato:false}; });
      if(formPersone.length===0){ formPersone = [{nome:"", costo:"", pagato:false}]; }
      formDaProgramma = j.id;
      renderTab("nuova");
      showToast("Inserisci importo e costi, poi registra");
    });
  });
}

/* ---------------- ELENCO PERSONE (SQUADRA) ---------------- */
var SQ_KEY = "wservice_squadra_v1";
var squadra = [];
function saveSq(){ try{ window.localStorage.setItem(SQ_KEY, JSON.stringify(squadra)); }catch(e){} }
function loadSq(){
  var r = null;
  try{ r = window.localStorage.getItem(SQ_KEY); }catch(e){}
  if(r !== null){ try{ squadra = JSON.parse(r) || []; }catch(e){ squadra = []; } return; }
  var m = {};
  giornate.forEach(function(g){ (g.persone||[]).forEach(function(p){ if(p.nome) m[p.nome] = 1; }); });
  programma.forEach(function(j){ (j.persone||[]).forEach(function(n){ m[n] = 1; }); });
  squadra = Object.keys(m).sort(function(a,b){ return a.localeCompare(b); });
  saveSq();
}
function sqAggiungi(n){
  n = (n||"").trim(); if(!n) return "";
  var e = squadra.filter(function(x){ return x.toLowerCase()===n.toLowerCase(); })[0];
  if(e) return e;
  squadra.push(n);
  squadra.sort(function(a,b){ return a.localeCompare(b); });
  saveSq();
  return n;
}
function sqRimuovi(n){ squadra = squadra.filter(function(x){ return x!==n; }); saveSq(); }

function progLeggi(){
  var f = progForm;
  f.data = document.getElementById("p-data").value;
  f.ora = document.getElementById("p-ora").value;
  f.cliente = document.getElementById("p-cliente").value;
  f.note = document.getElementById("p-note").value;
  f.persone = [];
  document.querySelectorAll(".p-chk").forEach(function(c){ if(c.checked){ f.persone.push(c.value); } });
}

function renderProgForm(){
  var f = progForm;
  var elenco = squadra.slice();
  f.persone.forEach(function(n){ if(elenco.indexOf(n)<0){ elenco.push(n); } });
  var chk = elenco.map(function(n){
    return '<div class="sq-row"><label class="chk-row"><input type="checkbox" class="p-chk" value="' + escapeHtml(n) + '"' + (f.persone.indexOf(n)>=0 ? ' checked' : '') + '> ' + escapeHtml(n) + '</label>' +
      '<button class="sq-rm" data-sqrm="' + escapeHtml(n) + '" title="Togli dall\'elenco">&times;</button></div>';
  }).join("");
  $content.innerHTML =
    '<h2 class="section-title">' + (f.id ? 'Modifica montaggio' : 'Nuovo montaggio') + '</h2>' +
    '<label>Data</label><input type="date" id="p-data" value="' + escapeHtml(f.data) + '">' +
    '<label>Ora (facoltativa)</label><input type="time" id="p-ora" value="' + escapeHtml(f.ora||"") + '">' +
    '<label>Cliente</label><input type="text" id="p-cliente" list="p-clienti" autocomplete="off" autocapitalize="words" value="' + escapeHtml(f.cliente||"") + '">' +
    '<datalist id="p-clienti">' + clientiNoti().map(function(c){ return '<option value="' + escapeHtml(c) + '">'; }).join("") + '</datalist>' +
    '<label>Persone della squadra</label>' + (chk || '<div class="persona-hint" style="text-align:left;">Elenco vuoto: aggiungi una persona qui sotto.</div>') +
    '<label>Aggiungi una persona all\'elenco</label>' +
    '<div class="sq-add"><input type="text" id="p-altre" autocapitalize="words" placeholder="Nome e cognome"><button class="sq-addbtn" id="p-add">Aggiungi</button></div>' +
    '<label>Note / indirizzo</label><input type="text" id="p-note" value="' + escapeHtml(f.note||"") + '">' +
    '<button class="btn-primary" id="p-salva">Salva montaggio</button>' +
    '<button class="btn-secondary" id="p-annulla">Annulla</button>';

  on(document.getElementById("p-annulla"), "click", function(){ progForm = null; renderCalendario(); });
  on(document.getElementById("p-add"), "click", function(){
    var n = document.getElementById("p-altre").value.trim();
    if(!n){ showToast("Scrivi il nome da aggiungere"); return; }
    progLeggi();
    n = sqAggiungi(n);
    if(f.persone.indexOf(n)<0){ f.persone.push(n); }
    renderProgForm();
  });
  document.querySelectorAll("[data-sqrm]").forEach(function(b){
    on(b, "click", function(){
      var n = b.dataset.sqrm;
      if(!confirm("Togliere " + n + " dall'elenco?\n\nLe giornate già registrate non cambiano.")) return;
      progLeggi();
      sqRimuovi(n);
      f.persone = f.persone.filter(function(x){ return x!==n; });
      renderProgForm();
    });
  });
  on(document.getElementById("p-salva"), "click", function(){
    progLeggi();
    var extra = document.getElementById("p-altre").value.trim();
    if(extra){ var nn = sqAggiungi(extra); if(f.persone.indexOf(nn)<0){ f.persone.push(nn); } }
    if(!f.data || !f.cliente.trim()){ showToast("Inserisci data e cliente"); return; }
    var persone = f.persone.slice();
    var occupati = [];
    programma.forEach(function(o){
      if(o.id!==f.id && !o.fatto && o.data===f.data){
        (o.persone||[]).forEach(function(n){ if(persone.indexOf(n)>=0 && occupati.indexOf(n)<0){ occupati.push(n); } });
      }
    });
    if(occupati.length && !confirm(occupati.join(", ") + " ha già un altro montaggio in quella data.\n\nSalvare comunque?")){ return; }
    var job = {id: f.id || uid(), data:f.data, ora:f.ora, cliente:f.cliente.trim(), persone:persone, note:f.note.trim(), fatto:!!f.fatto};
    if(f.id){
      var ix = programma.findIndex(function(x){ return x.id===f.id; });
      if(ix>=0){ programma[ix] = job; } else { programma.push(job); }
    } else { programma.push(job); }
    saveProg();
    calGiorno = job.data; calMese = job.data.slice(0,7); progForm = null;
    showToast("Montaggio salvato \u2713");
    renderCalendario();
  });
}

var AZ_KEY = "wservice_azienda_v1";
var AZ_DEFAULT = ["Ragione sociale","Partita IVA","Codice fiscale","Codice SDI","PEC","Email","Telefono","Indirizzo sede","IBAN","Codice ATECO","Numero REA"];
var azienda = [];
var azEdit = false;

function loadAz(){
  try{ var r = window.localStorage.getItem(AZ_KEY); if(r){ azienda = JSON.parse(r) || []; } }catch(e){}
  if(!azienda.length){ azienda = AZ_DEFAULT.map(function(l){ return {l:l, v:""}; }); }
}
function saveAz(){ try{ window.localStorage.setItem(AZ_KEY, JSON.stringify(azienda)); }catch(e){ showToast("Impossibile salvare i dati"); } }
function copiaFallback(t){
  var a = document.createElement("textarea");
  a.value = t; a.style.position = "fixed"; a.style.opacity = "0";
  document.body.appendChild(a); a.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(a);
}
function copiaTesto(t){
  var fine = function(){ showToast("Copiato \u2713"); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(fine).catch(function(){ copiaFallback(t); fine(); });
  } else { copiaFallback(t); fine(); }
}
function azLeggi(){
  var ls = document.querySelectorAll(".az-l"), vs = document.querySelectorAll(".az-v");
  azienda = [];
  for(var i=0;i<ls.length;i++){ azienda.push({l:ls[i].value.trim(), v:vs[i].value.trim()}); }
}

function renderAzienda(){
  if(azEdit){
    var rows = azienda.map(function(r,i){
      return '<div class="az-edit"><input type="text" class="az-l" placeholder="Voce" value="' + escapeHtml(r.l) + '">' +
        '<input type="text" class="az-v" placeholder="Valore" autocapitalize="off" value="' + escapeHtml(r.v) + '">' +
        '<button class="az-rm" data-azrm="' + i + '">&times;</button></div>';
    }).join("");
    $content.innerHTML =
      '<h2 class="section-title">Modifica dati azienda</h2>' + rows +
      '<button class="btn-secondary" id="az-add">+ Aggiungi voce</button>' +
      '<button class="btn-primary" id="az-salva">Salva</button>' +
      '<button class="btn-cancel" id="az-annulla">Annulla</button>';
    on(document.getElementById("az-add"), "click", function(){ azLeggi(); azienda.push({l:"",v:""}); renderAzienda(); });
    document.querySelectorAll("[data-azrm]").forEach(function(b){
      on(b, "click", function(){ azLeggi(); azienda.splice(parseInt(b.dataset.azrm,10),1); renderAzienda(); });
    });
    on(document.getElementById("az-salva"), "click", function(){
      azLeggi();
      azienda = azienda.filter(function(r){ return r.l || r.v; });
      saveAz(); azEdit = false; showToast("Dati salvati \u2713"); renderAzienda();
    });
    on(document.getElementById("az-annulla"), "click", function(){ loadAz(); azEdit = false; renderAzienda(); });
    return;
  }
  var piene = azienda.map(function(r,i){ return {r:r,i:i}; }).filter(function(x){ return x.r.v; });
  var righe = piene.map(function(x){
    return '<div class="az-row"><div class="az-txt"><div class="az-lbl">' + escapeHtml(x.r.l) + '</div><div class="az-val">' + escapeHtml(x.r.v) + '</div></div>' +
      '<button class="az-copy" data-az="' + x.i + '">Copia</button></div>';
  }).join("");
  $content.innerHTML =
    '<h2 class="section-title">Dati azienda</h2>' +
    (righe ? '<div class="az-card">' + righe + '</div>' : '<div class="msg-empty">Nessun dato inserito.<br>Tocca Modifica per aggiungere partita IVA, codici e contatti.</div>') +
    (righe ? '<button class="btn-secondary" id="az-all">Copia tutto</button>' : '') +
    '<button class="btn-primary" id="az-mod">Modifica dati</button>';
  document.querySelectorAll("[data-az]").forEach(function(b){
    on(b, "click", function(){ copiaTesto(azienda[parseInt(b.dataset.az,10)].v); });
  });
  on(document.getElementById("az-all"), "click", function(){
    copiaTesto(piene.map(function(x){ return x.r.l + ": " + x.r.v; }).join("\n"));
  });
  on(document.getElementById("az-mod"), "click", function(){ azEdit = true; renderAzienda(); });
}

/* ---------------- TAB SWITCH ---------------- */
function renderTab(tab){
  CURRENT_TAB = tab;
  document.querySelectorAll("nav.tabbar button").forEach(function(b){
    b.classList.toggle("active", b.dataset.tab===tab);
  });
  renderTotalsStrip();
  if(tab==="nuova") renderNuova();
  else if(tab==="giornate") renderGiornate();
  else if(tab==="riepilogo") renderRiepilogo();
  else if(tab==="calendario") renderCalendario();
  else if(tab==="azienda") renderAzienda();
}

document.querySelectorAll("nav.tabbar button").forEach(function(b){
  on(b, "click", function(){ renderTab(b.dataset.tab); });
});

var errBanner = document.getElementById("error-banner");
if(errBanner){
  errBanner.addEventListener("click", function(){ errBanner.style.display = "none"; });
}
window.addEventListener("error", function(e){
  reportError((e && e.error) ? e.error : (e && e.message ? e.message : "errore sconosciuto"));
});
window.addEventListener("unhandledrejection", function(e){
  reportError(e && e.reason ? e.reason : "operazione non riuscita");
});
