<title>Registro Giornate — W SERVICE</title>
<style>
:root{
  color-scheme:dark light;
  --bg:#0A1222; --card:#131E35; --fill:rgba(130,150,190,.16);
  --ink:#F3F6FC; --ink-soft:rgba(228,236,252,.62); --ink-faint:rgba(228,236,252,.36);
  --sep:rgba(255,255,255,.08); --hair:rgba(255,255,255,.06);
  --accent:#4D8DFF; --accent-bg:rgba(77,141,255,.17); --accent-sh:rgba(77,141,255,.55);
  --credit:#34D68B; --credit-bg:rgba(52,214,139,.15); --debit:#FF6F66; --debit-bg:rgba(255,111,102,.15); --warn:#FFB84D; --warn-bg:rgba(255,184,77,.15);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset; --glass:rgba(19,30,53,.74); --glow:rgba(77,141,255,.20); --glow2:rgba(40,70,140,.26);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Segoe UI",Roboto,sans-serif;
  --font-display:var(--font); --font-mono:var(--font); --font-body:var(--font);
  --brass:var(--warn); --brass-bg:var(--warn-bg); --rule:var(--sep); --rule-soft:var(--hair); --paper:var(--bg); --r:22px;
}
@media (prefers-color-scheme:light){:root{
  --bg:#EDF0F6; --card:#FFFFFF; --fill:rgba(60,80,120,.09);
  --ink:#0E1A30; --ink-soft:rgba(14,26,48,.60); --ink-faint:rgba(14,26,48,.36);
  --sep:rgba(14,26,48,.09); --hair:rgba(14,26,48,.05);
  --accent:#1F5FE8; --accent-bg:rgba(31,95,232,.10); --accent-sh:rgba(31,95,232,.50);
  --credit:#12945A; --credit-bg:rgba(18,148,90,.11); --debit:#D93A31; --debit-bg:rgba(217,58,49,.09); --warn:#B87400; --warn-bg:rgba(184,116,0,.12);
  --shadow:0 1px 2px rgba(14,26,48,.04),0 10px 28px -8px rgba(14,26,48,.10); --glass:rgba(255,255,255,.76); --glow:rgba(31,95,232,.10); --glow2:rgba(120,160,255,.14);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--bg);color:var(--ink);font:16px/1.4 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(120px + env(safe-area-inset-bottom,0px));
  background-image:radial-gradient(820px 340px at 90% -90px,var(--glow),transparent 70%),radial-gradient(640px 300px at -5% -70px,var(--glow2),transparent 70%);background-repeat:no-repeat}
header.top{max-width:520px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) 20px 4px}
header.top .hin{display:flex;align-items:center;justify-content:space-between;gap:14px}
header.top .hin img{order:2;height:56px;width:auto;padding:9px 10px;background:#14223B;border-radius:18px;box-shadow:0 10px 24px -6px rgba(8,16,34,.5),inset 0 0 0 1px rgba(255,255,255,.09)}
header.top .eyebrow{font-size:12.5px;font-weight:600;letter-spacing:.01em;color:var(--ink-soft);text-transform:none}
header.top h1{margin:3px 0 0;font-size:35px;line-height:1.08;font-weight:800;letter-spacing:-.035em;color:var(--ink)}
.ruler{display:none}
.wrap{max-width:520px;margin:0 auto;padding:8px 20px}
#totals-strip-wrap:empty{display:none}
#error-banner.wrap{display:none;margin:8px auto 0;width:calc(100% - 40px);padding:12px 16px;background:var(--debit-bg);color:var(--debit);border-radius:16px;font-size:13.5px;font-weight:600}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
#content>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
#content>*:nth-child(2){animation-delay:.04s}#content>*:nth-child(3){animation-delay:.08s}#content>*:nth-child(4){animation-delay:.12s}#content>*:nth-child(n+5){animation-delay:.16s}
h2.section-title{display:flex;align-items:center;gap:8px;margin:28px 4px 10px;font-size:13px;font-weight:650;letter-spacing:.01em;text-transform:none;color:var(--ink-soft)}
h2.section-title.dup{display:none}
h2.section-title .count{background:var(--fill);padding:1px 9px;border-radius:99px;font-size:12px;font-weight:650;color:var(--ink-soft)}
.sub-title{margin:22px 4px 8px;font-size:13px;font-weight:650;color:var(--ink-soft)}
.card,.giorno-card,.prog-card,.ledger-entity,.az-card,.tot-card,.cal-grid{background:var(--card);border-radius:var(--r);border:1px solid var(--hair);box-shadow:var(--shadow)}
.card{padding:4px 18px 20px}
label{display:block;margin:18px 2px 7px;font-size:13px;font-weight:650;color:var(--ink-soft);text-transform:none;letter-spacing:0}
input[type=text],input[type=number],input[type=date],input[type=time],textarea,select{display:block;width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--fill);border:1.5px solid transparent;border-radius:14px;padding:13px 14px;min-height:48px;-webkit-appearance:none;appearance:none;outline:none;transition:border-color .15s,background .15s,box-shadow .15s}
textarea{min-height:92px;resize:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent);background:var(--card);box-shadow:0 0 0 4px var(--accent-bg)}
input::placeholder,textarea::placeholder{color:var(--ink-faint)}
select{padding-right:40px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9'><path d='M1.5 1.5l5.5 5.5 5.5-5.5' stroke='%238A97B0' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");background-repeat:no-repeat;background-position:right 15px center}
input[type=checkbox]{width:22px;height:22px;margin:0;flex:none;accent-color:var(--accent)}
.chk-row{display:flex;align-items:center;gap:12px;margin:12px 0;font-size:16px;font-weight:500;color:var(--ink)}
.persona-group{margin-top:10px}
.persona-entry{display:flex;gap:8px;align-items:center}
.persona-entry input:first-child{flex:1.5}.persona-entry input:nth-child(2){flex:1}
.rm-btn{width:44px;height:44px;flex:none;border:0;border-radius:13px;background:var(--debit-bg);color:var(--debit);font-size:22px;line-height:1}
.persona-hint{margin:6px 4px 0;text-align:right;font-size:12.5px;color:var(--ink-soft);min-height:14px}
.persona-hint .amt{color:var(--accent);font-weight:650}
.persona-pagato{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin:8px 0 0;font-size:14px;font-weight:500;color:var(--ink-soft)}
.persona-pagato input{width:20px;height:20px}
.editing-banner{margin:0 0 12px;padding:12px 14px;border-radius:16px;background:var(--warn-bg);color:var(--warn);font-size:14px;font-weight:650}
button{font:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;transition:transform .14s ease,filter .14s ease,background .2s}
button:active{transform:scale(.97)}
.btn-primary,.btn-secondary,.btn-cancel,.btn-saldo,.btn-costo,.btn-pdf{display:block;width:100%;margin-top:14px;padding:15px 16px;border:0;border-radius:17px;font-size:16.5px;font-weight:650;letter-spacing:-.01em;text-transform:none}
.btn-primary,.btn-pdf{background:var(--accent);color:#fff;box-shadow:0 12px 24px -10px var(--accent-sh)}
.btn-secondary,.btn-cancel,.btn-costo,.btn-pdf.light{background:var(--accent-bg);color:var(--accent);box-shadow:none}
.btn-saldo{background:var(--credit-bg);color:var(--credit)}
.giorno-actions{display:flex;gap:8px;margin-top:14px}
.btn-edit,.btn-del{flex:1;padding:12px 8px;border:0;border-radius:13px;font-size:14.5px;font-weight:650}
.btn-edit{background:var(--accent-bg);color:var(--accent)}
.btn-del{background:var(--debit-bg);color:var(--debit)}
.badge-pag,.st,.prog-tag,.pay-toggle{display:inline-flex;align-items:center;padding:4px 10px;border:0;border-radius:99px;font-size:12px;font-weight:650;letter-spacing:0;text-transform:none;background:var(--fill);color:var(--ink-soft)}
.badge-pag{margin:7px 6px 0 0}
.badge-pag.cash{background:var(--warn-bg);color:var(--warn)}.badge-pag.fattura{background:var(--accent-bg);color:var(--accent)}.badge-pag.inc{background:var(--credit-bg);color:var(--credit)}
.st.ok,.pay-toggle.paid,.prog-tag{background:var(--credit-bg);color:var(--credit)}
.st.no,.pay-toggle.unpaid{background:var(--debit-bg);color:var(--debit)}
.st{margin-left:8px}
.az-rm,.sq-rm,.pay-rm{border:0;border-radius:12px;background:var(--debit-bg);color:var(--debit);font-size:20px;line-height:1;flex:none}
.az-rm{height:48px}.sq-rm{width:36px;height:36px}.pay-rm{width:28px;height:28px;border-radius:50%;font-size:16px}
.msg-empty{padding:40px 14px;text-align:center;color:var(--ink-soft);font-size:15px;line-height:1.55;font-style:normal}
.filter-row{margin:4px 0 14px}
.totals-strip{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 6px}
.tot-card{padding:16px 16px 15px}
.tot-card.spese{grid-column:1/-1}
.tot-card .lbl{font-size:13px;font-weight:600;color:var(--ink-soft);text-transform:none;letter-spacing:0}
.tot-card .val{margin-top:5px;font-size:23px;font-weight:780;letter-spacing:-.03em}
.tot-card.credit .val{color:var(--credit)}.tot-card.debit .val{color:var(--debit)}.tot-card.margin .val{color:var(--accent)}
.spese-sub{margin-top:6px;font-size:12.5px;color:var(--ink-soft)}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
.cal-nav button{width:42px;height:42px;border:0;border-radius:50%;background:var(--card);color:var(--accent);font-size:23px;line-height:1;box-shadow:var(--shadow)}
.cal-mese{font-size:21px;font-weight:760;letter-spacing:-.025em}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px 0;padding:14px 8px 12px}
.cal-dow{text-align:center;padding-bottom:6px;font-size:11.5px;font-weight:650;color:var(--ink-faint)}
.cal-day{position:relative;display:block;width:100%;max-width:44px;aspect-ratio:1;margin:0 auto;padding:0;border:0;border-radius:50%;background:transparent;color:var(--ink);font-size:17px;font-weight:500}
.cal-day.today{color:var(--accent);font-weight:780}
.cal-day.sel{background:var(--accent);color:#fff;font-weight:700;box-shadow:0 8px 18px -5px var(--accent-sh)}
.cal-dot{position:absolute;left:50%;bottom:5px;width:5px;height:5px;min-width:0;padding:0;border-radius:50%;background:var(--accent);font-size:0;transform:translateX(-50%)}
.cal-day.sel .cal-dot{background:#fff}
.prog-card{position:relative;margin-bottom:12px;padding:16px 18px}
.prog-card::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:4px;border-radius:0 4px 4px 0;background:var(--accent)}
.prog-card.done{opacity:.62}.prog-card.done::before{background:var(--credit)}
.prog-card .cli{font-size:18px;font-weight:720;letter-spacing:-.02em}
.prog-card .meta{margin-top:3px;font-size:14px;color:var(--ink-soft)}
.prog-note{margin-top:6px;font-size:14px;color:var(--ink-soft)}
.sq-row{display:flex;align-items:center;gap:8px}.sq-row .chk-row{flex:1;margin:4px 0;padding:6px 0}
.sq-add{display:flex;gap:8px}.sq-add input{flex:1}
.sq-addbtn{padding:0 20px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-size:15px;font-weight:650;text-transform:none;letter-spacing:0}
.giorno-card{margin-bottom:12px;overflow:hidden}
.giorno-head{display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer}
.giorno-day{flex:none;width:54px;height:54px;display:flex;align-items:center;justify-content:center;border-radius:17px;background:var(--accent-bg);color:var(--accent);font-size:15px;font-weight:760;letter-spacing:-.01em;border:0}
.giorno-info{flex:1;min-width:0}
.giorno-info .cli{font-size:17px;font-weight:720;letter-spacing:-.02em;white-space:normal;overflow:visible;text-transform:none}
.meta{margin-top:2px;font-size:13.5px;color:var(--ink-soft)}
.giorno-amt{text-align:right}
.imp{font-size:18px;font-weight:760;letter-spacing:-.02em;color:var(--credit)}
.margine{margin-top:2px;font-size:12.5px;color:var(--ink-soft)}
.giorno-detail{display:none;padding:2px 18px 16px;border-top:1px solid var(--sep)}
.giorno-detail.open{display:block}
.dline{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--sep);font-size:15.5px}
.dline>span:last-child{display:flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap}
.ledger-entity{margin-bottom:12px;overflow:hidden}
.ledger-entity-head{display:flex;align-items:center;gap:12px;padding:16px 18px;cursor:pointer}
.ledger-entity-head>div:first-child{flex:1;min-width:0}
.ledger-entity-head::after{content:"";flex:none;width:8px;height:8px;margin:0 3px 0 2px;border-right:2px solid var(--ink-faint);border-bottom:2px solid var(--ink-faint);transform:rotate(-45deg);transition:transform .28s cubic-bezier(.3,.9,.3,1)}
.ledger-entity.aperto .ledger-entity-head::after{transform:rotate(45deg)}
.en-name{font-size:17px;font-weight:720;letter-spacing:-.02em}
.en-sub{margin-top:3px;font-size:13px;line-height:1.35;color:var(--ink-soft)}
.en-amt{font-size:18px;font-weight:760;letter-spacing:-.02em;white-space:nowrap}
.en-amt.d{color:var(--debit)}.en-amt.c{color:var(--credit)}
.bar{height:6px;margin-top:10px;border-radius:99px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--credit),#7BE8B8);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.ledger-entity-body{display:none;padding:2px 18px 16px;border-top:1px solid var(--sep)}
.ledger-entity-body.open{display:block}
.saldo-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 8px}
.saldo-row div{padding:10px 12px;border-radius:14px;background:var(--fill)}
.saldo-row span{display:block;font-size:11.5px;font-weight:600;color:var(--ink-soft)}
.saldo-row b{font-size:16px;font-weight:760;letter-spacing:-.02em}
.saldo-row .ok b{color:var(--credit)}.saldo-row .no b{color:var(--debit)}
.eline{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--sep);font-size:14.5px}
.eline .d1{flex:1;min-width:0}
.eline .eamt{font-weight:650;white-space:nowrap}
.pdf-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pdf-row .btn-pdf{margin-top:0;padding:13px 8px;font-size:14.5px}
.az-card{overflow:hidden}
.az-row{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--sep)}
.az-row:last-child{border-bottom:0}
.az-txt{flex:1;min-width:0}
.az-lbl{font-size:12.5px;font-weight:600;color:var(--ink-soft);text-transform:none;letter-spacing:0}
.az-val{margin-top:2px;font-size:16.5px;font-weight:600;overflow-wrap:anywhere}
.az-copy{padding:8px 15px;border:0;border-radius:99px;background:var(--accent-bg);color:var(--accent);font-size:13.5px;font-weight:650;text-transform:none;letter-spacing:0}
.az-edit{display:grid;grid-template-columns:1fr 1.4fr 46px;gap:8px;margin-bottom:8px;align-items:center}
nav.tabbar{position:fixed;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;max-width:492px;margin:0 auto;display:flex;padding:6px;border-radius:32px;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(26px);backdrop-filter:saturate(180%) blur(26px);border:1px solid var(--hair);box-shadow:0 20px 44px -14px rgba(0,0,0,.5)}
nav.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 7px;border:0;border-radius:26px;background:transparent;color:var(--ink-soft);font-size:10.5px;font-weight:650;letter-spacing:0;text-transform:none;transition:background .3s,color .3s,transform .14s}
nav.tabbar button.active{background:var(--accent-bg);color:var(--accent)}
nav.tabbar .ic{display:flex}
nav.tabbar .ic svg{width:24px;height:24px;stroke-width:1.7}
.toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom,0px));z-index:60;max-width:86vw;padding:11px 18px;border-radius:99px;background:rgba(18,26,44,.94);color:#fff;font-size:14px;font-weight:600;text-align:center;opacity:0;pointer-events:none;transform:translate(-50%,10px);transition:opacity .25s,transform .25s;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
header.top .hin img{height:64px;padding:10px 11px;background:linear-gradient(160deg,#1E3560,#14223B);filter:brightness(1.12)}
.tot-card.margin{order:-1;grid-column:1/-1;padding:18px 18px 17px}
.tot-card.margin .val{font-size:32px;letter-spacing:-.04em}
</style>
</head>

<script>
"use strict";

var STORAGE_KEY = "wservice_registro_giornate_v2";
try{ if(navigator.storage && navigator.storage.persist){ navigator.storage.persist(); } }catch(e){}
var BACKUP_KEY = "wservice_ultimo_backup";
var giornate = [];
var storageOk = true;

function loadData(){
  try{
    var raw = window.localStorage.getItem(STORAGE_KEY);
    if(raw){ giornate = JSON.parse(raw) || []; }
  }catch(e){
    storageOk = false;
    console.warn("Salvataggio locale non disponibile:", e);
  }
}
function saveData(){
  try{
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify(giornate));
  }catch(e){
    storageOk = false;
    console.warn("Impossibile salvare:", e);
    showToast("Attenzione: impossibile salvare i dati su questo dispositivo");
  }
  cloudPush();
}

/* ---------------- SALVATAGGIO NEL CLOUD (account Claude) ---------------- */
var cloud = null, cloudYears = {}, cloudTimer = null, cloudWarned = false;

function cloudYear(g){ return String(g.data||"").slice(0,4) || "0000"; }

function cloudPush(){
  if(!cloud) return;
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(function(){
    var perAnno = {};
    giornate.forEach(function(g){
      var y = cloudYear(g);
      (perAnno[y] = perAnno[y] || []).push(g);
    });
    Object.keys(cloudYears).forEach(function(y){ if(!perAnno[y]) perAnno[y] = []; });
    var jobs = Object.keys(perAnno).map(function(y){
      cloudYears[y] = true;
      return cloud.doc("anno-" + y).set({ giornate: perAnno[y] });
    });
    Promise.all(jobs).catch(function(e){
      console.warn("Cloud non raggiungibile:", e);
      if(!cloudWarned){ cloudWarned = true; showToast("Salvato solo su questo telefono (cloud non raggiungibile)"); }
    });
  }, 500);
}

function cloudInit(){
  if(!window.claude || !window.claude.use) return;
  Promise.all([window.claude.use("db"), window.claude.use("user")]).then(function(r){
    var db = r[0], user = r[1];
    if(!db || !user) return null;
    return user.id().then(function(id){
      if(!id) return null;
      var col = db.collection("data/users/" + id);
      return col.get().then(function(snap){
        cloud = col;
        if(snap.empty){
          if(giornate.length){ cloudPush(); showToast("Dati copiati nel cloud \u2713"); }
          return;
        }
        var remote = [];
        snap.docs.forEach(function(d){
          var dat = d.data() || {};
          cloudYears[d.id.replace("anno-","")] = true;
          (dat.giornate || []).forEach(function(g){ remote.push(g); });
        });
        giornate = remote;
        try{ window.localStorage.setItem(STORAGE_KEY, JSON.stringify(giornate)); }catch(e){}
        renderTab(CURRENT_TAB);
        showToast("Dati sincronizzati \u2713");
      });
    });
  }).catch(function(e){ console.warn("Cloud non disponibile:", e); });
}

var CURRENT_TAB = "calendario";
var editingId = null;
var formPersone = [{nome:"", costo:"", pagato:false}];
var formData = "";
var formCliente = "";
var formImporto = "";
var formNote = "";
var formCarb = "";
var formPasti = "";
var formFurg = "";
var formIncassato = false;
var formPagamento = "";

var openGiornoId = null;
var RIEPILOGO_MESE = "tutti";
var openLedgerId = null;

var $content = document.getElementById("content");
var $totalsWrap = document.getElementById("totals-strip-wrap");

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function eur(n){
  n = n || 0;
  return (Math.round(n*100)/100).toLocaleString("it-IT",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function todayISO(){
  var d = new Date();
  var m = String(d.getMonth()+1).padStart(2,"0");
  var day = String(d.getDate()).padStart(2,"0");
  return d.getFullYear()+"-"+m+"-"+day;
}
function fmtDate(iso){
  var d = new Date(iso+"T00:00:00");
  return d.toLocaleDateString("it-IT",{day:"2-digit",month:"short",year:"numeric"});
}
function fmtDateShort(iso){
  var d = new Date(iso+"T00:00:00");
  return d.toLocaleDateString("it-IT",{day:"2-digit",month:"2-digit"});
}
function monthKey(iso){ return iso.slice(0,7); }
function monthLabel(key){
  var parts = key.split("-");
  var d = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, 1);
  var s = d.toLocaleDateString("it-IT",{month:"long",year:"numeric"});
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function showToast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(function(){ t.classList.remove("show"); }, 1800);
}

function showErrorBanner(msg){
  var b = document.getElementById("error-banner");
  if(!b) return;
  b.textContent = "Si e' verificato un problema: " + msg + " (tocca per chiudere)";
  b.style.display = "block";
}
function reportError(err){
  console.error(err);
  showErrorBanner(err && err.message ? err.message : String(err));
}
function on(el, evt, fn){
  if(!el){ reportError({message:"elemento mancante per evento " + evt}); return; }
  el.addEventListener(evt, function(e){
    try{ fn(e); }
    catch(err){ reportError(err); }
  });
}
function escapeHtml(s){
  s = (s===undefined || s===null) ? "" : String(s);
  return s.replace(/[&<>"']/g, function(m){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m];
  });
}

function giornoCosti(g){
  var tot = 0;
  (g.persone||[]).forEach(function(p){ tot += (p.costo||0); });
  return tot;
}
function giornoMargine(g){ return (g.importoCliente||0) - giornoCosti(g); }
function giornoDaIncassare(g){ return g.incassato ? 0 : (g.importoCliente||0); }
function giornoSpese(g){ return g.spese || 0; }
function giornoNonPagato(g){
  var tot = 0;
  (g.persone||[]).forEach(function(p){ if(!p.pagato) tot += (p.costo||0); });
  return tot;
}
function pagamentoLabel(v){
  if(v==="cash") return "Cash";
  if(v==="fattura") return "Fattura";
  return "";
}

function listaClientiStorici(){
  var set = {};
  giornate.forEach(function(g){ if(g.cliente) set[g.cliente]=true; });
  return Object.keys(set).sort();
}
function listaPersoneStoriche(){
  var set = {};
  giornate.forEach(function(g){
    (g.persone||[]).forEach(function(p){ if(p.nome) set[p.nome]=true; });
  });
  return Object.keys(set).sort();
}

function totaliComplessiviHtml(){
  var totCredit = 0, totDebit = 0, totNonPagato = 0, totSpese = 0, totCarb = 0, totPasti = 0, totFurg = 0, totInc = 0;
  giornate.forEach(function(g){
    totCredit += (g.importoCliente||0);
    totDebit += giornoCosti(g);
    totNonPagato += giornoNonPagato(g);
    totSpese += giornoSpese(g);
    totInc += giornoDaIncassare(g);
    totCarb += (g.carburante||0);
    totPasti += (g.pasti||0);
    totFurg += (g.furgone||0);
  });
  var margine = totCredit - totDebit;
  return '<div class="totals-strip">' +
      '<div class="tot-card credit"><div class="lbl">Da clienti</div><div class="val">&euro; ' + eur(totCredit) + '</div></div>' +
      '<div class="tot-card credit"><div class="lbl">Da incassare</div><div class="val">&euro; ' + eur(totInc) + '</div></div>' +
      '<div class="tot-card debit"><div class="lbl">Alla squadra</div><div class="val">&euro; ' + eur(totDebit) + '</div></div>' +
      '<div class="tot-card debit"><div class="lbl">Da pagare</div><div class="val">&euro; ' + eur(totNonPagato) + '</div></div>' +
      '<div class="tot-card margin"><div class="lbl">Margine</div><div class="val">&euro; ' + eur(margine) + '</div></div>' +
      '<div class="tot-card spese"><div class="lbl">Spese (a parte)</div><div class="val">&euro; ' + eur(totSpese) + '</div><div class="spese-sub">carburante &euro; ' + eur(totCarb) + ' &middot; pasti &euro; ' + eur(totPasti) + ' &middot; furgone &euro; ' + eur(totFurg) + '</div></div>' +
    '</div>';
}
function renderTotalsStrip(){ $totalsWrap.innerHTML = ""; }

function personaTotaleStorico(nome){
  if(!nome) return 0;
  var key = nome.trim().toLowerCase();
  if(!key) return 0;
  var tot = 0;
  giornate.forEach(function(g){
    if(editingId && g.id===editingId) return;
    (g.persone||[]).forEach(function(p){
      if((p.nome||"").trim().toLowerCase()===key) tot += (p.costo||0);
    });
  });
  return tot;
}

/* ---------------- NUOVA GIORNATA ---------------- */
function resetForm(){
  editingId = null;
  formData = todayISO();
  formCliente = "";
  formImporto = "";
  formNote = "";
  formCarb = "";
  formPasti = "";
  formFurg = "";
  formIncassato = false;
  formPagamento = "";
  formDaProgramma = null;
  formPersone = [{nome:"", costo:"", pagato:false}];
}

function loadGiornoIntoForm(g){
  editingId = g.id;
  formData = g.data;
  formCliente = g.cliente;
  formImporto = String(g.importoCliente);
  formNote = g.note || "";
  formCarb = g.carburante ? String(g.carburante) : "";
  formPasti = g.pasti ? String(g.pasti) : "";
  formFurg = g.furgone ? String(g.furgone) : "";
  formIncassato = !!g.incassato;
  formPagamento = g.pagamentoCliente || "";
  formPersone = (g.persone||[]).map(function(p){ return {nome:p.nome, costo:String(p.costo), pagato:!!p.pagato}; });
  if(formPersone.length===0) formPersone = [{nome:"",costo:"",pagato:false}];
}

function updatePersonaHint(idx){
  var p = formPersone[idx];
  var hintEl = document.getElementById("hint-" + idx);
  if(!p || !hintEl) return;
  var storico = personaTotaleStorico(p.nome);
  var oggi = parseFloat(p.costo) || 0;
  if(!p.nome.trim()){
    hintEl.innerHTML = "";
  } else if(storico>0){
    hintEl.innerHTML = 'Gia\' maturato: &euro; ' + eur(storico) + ' &middot; con oggi: <span class="amt">&euro; ' + eur(storico+oggi) + '</span>';
  } else {
    hintEl.innerHTML = 'Prima giornata registrata per questa persona';
  }
}

function renderNuova(){
  var personeRows = formPersone.map(function(p, i){
    var storico = personaTotaleStorico(p.nome);
    var oggi = parseFloat(p.costo) || 0;
    var hintText = p.nome.trim()
      ? (storico>0
          ? 'Gia\' maturato: &euro; ' + eur(storico) + ' &middot; con oggi: <span class="amt">&euro; ' + eur(storico+oggi) + '</span>'
          : 'Prima giornata registrata per questa persona')
      : "";
    return '' +
      '<div class="persona-group">' +
        '<div class="persona-entry">' +
          '<input type="text" placeholder="Nome persona" autocomplete="off" autocapitalize="words" list="sq-list" data-idx="' + i + '" class="f-persona-nome" value="' + escapeHtml(p.nome) + '">' +
          '<input type="number" inputmode="decimal" step="0.01" placeholder="Costo &euro;" data-idx="' + i + '" class="f-persona-costo" value="' + escapeHtml(p.costo) + '">' +
          '<button class="rm-btn" data-rm="' + i + '" title="Rimuovi">&times;</button>' +
        '</div>' +
        '<label class="persona-pagato"><input type="checkbox" data-idx="' + i + '" class="f-persona-pagato"' + (p.pagato ? ' checked' : '') + '> Gi\u00e0 pagato</label>' +

  var editingBanner = editingId ? '<div class="editing-banner">Stai modificando una giornata esistente</div>' : "";

  $content.innerHTML =
    editingBanner +
    '<div class="card">' +
      '<label>Data</label>' +
      '<input type="date" id="f-data" value="' + formData + '">' +

      '<label>Cliente</label>' +
      '<input type="text" id="f-cliente" placeholder="Nome cliente" autocomplete="off" autocapitalize="words" value="' + escapeHtml(formCliente) + '">' +

      '<label>Importo pattuito con il cliente (&euro;)</label>' +
      '<input type="number" inputmode="decimal" step="0.01" id="f-importo" placeholder="0.00" value="' + escapeHtml(formImporto) + '">' +

      '<label>Come paga il cliente</label>' +
      '<select id="f-pagamento">' +
        '<option value=""' + (formPagamento===""?' selected':'') + '>Da definire</option>' +
        '<option value="cash"' + (formPagamento==="cash"?' selected':'') + '>Cash</option>' +
        '<option value="fattura"' + (formPagamento==="fattura"?' selected':'') + '>Fattura</option>' +
      '</select>' +
      '<label class="chk-row" style="margin-top:12px;"><input type="checkbox" id="f-incassato"' + (formIncassato ? ' checked' : '') + '> Il cliente ha gi\u00e0 pagato</label>' +

      '<label>Persone mandate a lavorare</label>' +
      '<div id="persone-rows">' + personeRows + '</div>' +
      '<datalist id="sq-list">' + squadra.map(function(n){ return '<option value="' + escapeHtml(n) + '">'; }).join("") + '</datalist>' +
      '<button class="btn-secondary" id="btn-add-row">+ Aggiungi persona</button>' +

      '<label>Carburante (&euro;) &middot; spesa fuori margine</label>' +
      '<input type="number" inputmode="decimal" step="0.01" id="f-carb" placeholder="0.00" value="' + escapeHtml(formCarb) + '">' +
      '<label>Pasti (&euro;) &middot; spesa fuori margine</label>' +
      '<input type="number" inputmode="decimal" step="0.01" id="f-pasti" placeholder="0.00" value="' + escapeHtml(formPasti) + '">' +
      '<label>Noleggio furgone (&euro;) &middot; spesa fuori margine</label>' +
      '<input type="number" inputmode="decimal" step="0.01" id="f-furgone" placeholder="0.00" value="' + escapeHtml(formFurg) + '">' +

      '<label>Note (opzionale)</label>' +
      '<textarea id="f-note" placeholder="es. montaggio cucina, 2&deg; piano senza ascensore&hellip;">' + escapeHtml(formNote) + '</textarea>' +

      '<button class="btn-primary" id="btn-salva-giorno">' + (editingId ? "Aggiorna giornata" : "Registra giornata") + '</button>' +
      (editingId ? '<button class="btn-cancel" id="btn-annulla-edit">Annulla modifica</button>' : "") +
    '</div>';

  on(document.getElementById("f-data"), "input", function(e){ formData = e.target.value; });
  on(document.getElementById("f-cliente"), "input", function(e){ formCliente = e.target.value; });
  on(document.getElementById("f-importo"), "input", function(e){ formImporto = e.target.value; });
  on(document.getElementById("f-pagamento"), "change", function(e){ formPagamento = e.target.value; });
  on(document.getElementById("f-note"), "input", function(e){ formNote = e.target.value; });
  on(document.getElementById("f-incassato"), "change", function(e){ formIncassato = e.target.checked; });
  on(document.getElementById("f-carb"), "input", function(e){ formCarb = e.target.value; });
  on(document.getElementById("f-pasti"), "input", function(e){ formPasti = e.target.value; });
  on(document.getElementById("f-furgone"), "input", function(e){ formFurg = e.target.value; });

  document.querySelectorAll(".f-persona-nome").forEach(function(inp){
    on(inp, "input", function(){
      var idx = parseInt(inp.dataset.idx,10);
      formPersone[idx].nome = inp.value;
      updatePersonaHint(idx);
    });
  });
  document.querySelectorAll(".f-persona-costo").forEach(function(inp){
    on(inp, "input", function(){
      var idx = parseInt(inp.dataset.idx,10);
      formPersone[idx].costo = inp.value;
      updatePersonaHint(idx);
    });
  });
  document.querySelectorAll(".f-persona-pagato").forEach(function(inp){
    on(inp, "change", function(){

      formPersone[idx].pagato = inp.checked;
    });
  });
  document.querySelectorAll("[data-rm]").forEach(function(btn){

      var idx = parseInt(btn.dataset.rm,10);
      formPersone.splice(idx,1);
      if(formPersone.length===0) formPersone = [{nome:"",costo:""}];
      renderNuova();
    });

  on(document.getElementById("btn-salva-giorno"), "click", function(){
    var cliente = (formCliente||"").trim();
    if(!cliente){ showToast("Inserisci il nome del cliente"); return; }
    var importo = parseFloat(formImporto);
    if(isNaN(importo)){ showToast("Inserisci l'importo del cliente"); return; }

    var persone = formPersone
      .map(function(p){ return {nome:(p.nome||"").trim(), costo: parseFloat(p.costo)||0, pagato: !!p.pagato}; })
      .filter(function(p){ return p.nome.length>0; });

    if(persone.length===0){ showToast("Aggiungi almeno una persona"); return; }

    if(editingId){
      var idx = giornate.findIndex(function(g){ return g.id===editingId; });
      if(idx>=0){
        giornate[idx] = {
          id: editingId,
          data: formData,
          cliente: cliente,
          importoCliente: importo,
          pagamentoCliente: formPagamento || "",
          incassato: !!formIncassato,
          carburante: parseFloat(formCarb) || 0,
          pasti: parseFloat(formPasti) || 0,

          persone: persone
        };

        id: uid(),
        data: formData,
        cliente: cliente,
        importoCliente: importo,

          carburante: parseFloat(formCarb) || 0,
          pasti: parseFloat(formPasti) || 0,
          furgone: parseFloat(formFurg) || 0,
          spese: (parseFloat(formCarb) || 0) + (parseFloat(formPasti) || 0) + (parseFloat(formFurg) || 0),

        if(pj){ pj.fatto = true; saveProg(); }
        formDaProgramma = null;
      }
    }
    saveData();
    resetForm();
    renderNuova();
    renderTotalsStrip();
  });
}

function renderGiornate(){

    $content.innerHTML = '<h2 class="section-title">Giornate</h2><div class="msg-empty">Nessuna giornata registrata.<br>Vai su "Nuova" per iniziare il registro.</div>';
    return;
  }
  var html = '<h2 class="section-title">Giornate <span class="count">' + lista.length + ' totali</span></h2>';

  lista.forEach(function(g){
    var costi = giornoCosti(g);
    var margine = giornoMargine(g);
    var nonPagato = giornoNonPagato(g);
    var isOpen = openGiornoId === g.id;
    var nPersone = (g.persone||[]).length;
    var pagLbl = pagamentoLabel(g.pagamentoCliente);
    var detailRows = (g.persone||[]).map(function(p, pi){

        '<button class="pay-rm" data-rmp-giorno="' + g.id + '" data-rmp-idx="' + pi + '" title="Togli dalla giornata">&times;</button>' +
        '</span></div>';
    }).join("");

    html +=
      '<div class="giorno-card">' +
        '<div class="giorno-head" data-id="' + g.id + '">' +
          '<div class="giorno-day">' + fmtDateShort(g.data) + '</div>' +
          '<div class="giorno-info">' +
            '<div class="cli">' + escapeHtml(g.cliente) + '</div>' +
            '<div class="meta">' + nPersone + (nPersone===1 ? ' persona' : ' persone') + ' &middot; ' + fmtDate(g.data) + '</div>' +
            (pagLbl ? '<div class="badge-pag ' + g.pagamentoCliente + '">' + pagLbl + '</div>' : '') +
            (g.incassato ? '<div class="badge-pag inc" style="margin-left:4px;">Incassato</div>' : '') +
          '</div>' +
          '<div class="giorno-amt">' +
            '<div class="imp">&euro; ' + eur(g.importoCliente) + '</div>' +
            '<div class="margine">margine &euro; ' + eur(margine) + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="giorno-detail ' + (isOpen ? "open" : "") + '">' +
          (g.note ? '<div style="font-family:var(--font-display);font-style:italic;font-size:13.5px;color:var(--ink-soft);margin:10px 0;">' + escapeHtml(g.note) + '</div>' : "") +
          detailRows +
          '<div class="dline"><span>Pagamento cliente' + (pagLbl ? ' &middot; ' + pagLbl : '') + '</span>' +
            '<span style="display:flex;align-items:center;gap:8px;">&euro; ' + eur(g.importoCliente) +
            '<button class="pay-toggle ' + (g.incassato ? "paid" : "unpaid") + '" data-inc-giorno="' + g.id + '">' + (g.incassato ? "Incassato" : "Da incassare") + '</button></span></div>' +
          '<div class="dline" style="font-weight:700;color:var(--ink);"><span>Totale squadra</span><span>&euro; ' + eur(costi) + '</span></div>' +
          (nonPagato>0 ? '<div class="dline" style="font-weight:700;color:var(--debit);"><span>Ancora da pagare</span><span>&euro; ' + eur(nonPagato) + '</span></div>' : '') +
          (g.spese>0 ? '<div class="dline" style="color:var(--ink-soft);"><span>Spese fuori margine' + ((g.carburante||g.pasti||g.furgone) ? ' &middot; carburante &euro; ' + eur(g.carburante||0) + ' &middot; pasti &euro; ' + eur(g.pasti||0) + ' &middot; furgone &euro; ' + eur(g.furgone||0) : '') + '</span><span>&euro; ' + eur(g.spese) + '</span></div>' : '') +
          '<div class="giorno-actions">' +
            '<button class="btn-edit" data-edit="' + g.id + '">Modifica</button>' +
            '<button class="btn-del" data-del="' + g.id + '">Elimina</button>' +
          '</div>' +
        '</div>' +
      '</div>';
  });

  $content.innerHTML = html;

  document.querySelectorAll(".giorno-head").forEach(function(h){
    on(h, "click", function(){
      var id = h.dataset.id;
      openGiornoId = (openGiornoId===id) ? null : id;
      renderGiornate();
    });
  });
  document.querySelectorAll("[data-pay-giorno]").forEach(function(btn){
    on(btn, "click", function(e){
      e.stopPropagation();
      var gid = btn.dataset.payGiorno;
      var pidx = parseInt(btn.dataset.payIdx,10);
      var g = giornate.find(function(x){ return x.id===gid; });
      if(g && g.persone && g.persone[pidx]){
        g.persone[pidx].pagato = !g.persone[pidx].pagato;
        saveData();
        renderGiornate();
        renderTotalsStrip();
      }
    });
  });
  document.querySelectorAll("[data-inc-giorno]").forEach(function(btn){
    on(btn, "click", function(e){
      e.stopPropagation();
      var g = giornate.find(function(x){ return x.id===btn.dataset.incGiorno; });
      if(!g) return;
      g.incassato = !g.incassato;
      saveData();
      renderGiornate();
    });
  });
  document.querySelectorAll("[data-rmp-giorno]").forEach(function(btn){
    on(btn, "click", function(e){
      e.stopPropagation();
      var g = giornate.find(function(x){ return x.id===btn.dataset.rmpGiorno; });
      var pidx = parseInt(btn.dataset.rmpIdx,10);
      if(!g || !g.persone || !g.persone[pidx]) return;
      if(!confirm("Togliere " + g.persone[pidx].nome + " da questa giornata?\n\nIl suo costo verrà tolto dai conti.")) return;
      g.persone.splice(pidx,1);
      saveData();
      renderGiornate();
      showToast("Persona tolta \u2713");
    });
  });
  document.querySelectorAll("[data-edit]").forEach(function(b){
    on(b, "click", function(e){
      e.stopPropagation();
      var id = b.dataset.edit;
      var g = giornate.find(function(x){ return x.id===id; });
      if(g){
        loadGiornoIntoForm(g);
        renderTab("nuova");
      }
    });
  });
  document.querySelectorAll("[data-del]").forEach(function(b){
    on(b, "click", function(e){
      e.stopPropagation();
      var id = b.dataset.del;
      if(confirm("Eliminare questa giornata dal registro?")){
        giornate = giornate.filter(function(g){ return g.id!==id; });
        saveData();
        showToast("Giornata eliminata");
        renderGiornate();
        renderTotalsStrip();
      }
    });
  });
}

/* ---------------- RIEPILOGO ---------------- */
function renderRiepilogo(){
  var backupSection =
    '<h2 class="section-title">Backup dati</h2>' +
    '<div class="card">' +
      '<div style="font-family:var(--font-body);font-size:13px;color:var(--ink-soft);margin-bottom:10px;">Scarica una copia di tutti i dati, o ripristinali da un backup precedente.</div>' +
      '<button class="btn-secondary" id="btn-export" style="margin-top:0;">&#8681; Esporta backup (.json)</button>' +
      '<button class="btn-secondary" id="btn-import">&#8679; Importa backup</button>' +
      '<input type="file" id="f-import-file" accept="application/json,.json" style="display:none;">' +
    '</div>';

  function wireBackupButtons(){
    on(document.getElementById("btn-export"), "click", function(){
      var payload = JSON.stringify({ giornate: giornate, programma: programma, azienda: azienda, squadra: squadra, esportato: new Date().toISOString() }, null, 2);
      var fname = "registro-giornate-backup-" + todayISO() + ".json";
      var ok = function(){
        try{ window.localStorage.setItem(BACKUP_KEY, todayISO()); }catch(e){}
        showToast("Backup salvato \u2713");
      };
      var scarica = function(){
        var blob = new Blob([payload], {type:"application/json"});
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url; a.download = fname;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
        ok();
      };
      try{
        var file = new File([payload], fname, {type:"application/json"});
        if(navigator.canShare && navigator.canShare({files:[file]})){
          navigator.share({files:[file], title:"Backup registro giornate"}).then(ok).catch(function(e){
            if(e && e.name!=="AbortError") scarica();
          });
          return;
        }
      }catch(e){}
      scarica();
    });

    on(document.getElementById("btn-import"), "click", function(){
      document.getElementById("f-import-file").click();
    });

    on(document.getElementById("f-import-file"), "change", function(e){
      var file = e.target.files && e.target.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(){
        try{
          var parsed = JSON.parse(reader.result);
          var imported = Array.isArray(parsed) ? parsed : parsed.giornate;
          if(!Array.isArray(imported)) throw new Error("Formato file non valido");
          var sostituisci = confirm("Importare " + imported.length + " giornate?\n\nOK = sostituisce tutti i dati attuali\nAnnulla = aggiunge questi dati a quelli esistenti");
          if(sostituisci){
            giornate = imported;
          } else {
            var existingIds = {};
            giornate.forEach(function(g){ existingIds[g.id] = true; });
            imported.forEach(function(g){
              if(!g.id || existingIds[g.id]) g.id = uid();
              giornate.push(g);
            });
          }
          if(!Array.isArray(parsed) && Array.isArray(parsed.programma)){
            if(sostituisci){ programma = parsed.programma; }
            else {
              var pid = {}; programma.forEach(function(x){ pid[x.id] = true; });
              parsed.programma.forEach(function(x){ if(!x.id || pid[x.id]) x.id = uid(); programma.push(x); });
            }
            saveProg();
          }
          if(!Array.isArray(parsed) && Array.isArray(parsed.squadra)){ parsed.squadra.forEach(function(n){ sqAggiungi(n); }); }
          if(!Array.isArray(parsed) && Array.isArray(parsed.azienda) && parsed.azienda.length){ azienda = parsed.azienda; saveAz(); }
          saveData();
          showToast("Backup importato \u2713");
          renderRiepilogo();
          renderTotalsStrip();
        }catch(err){
          reportError(err);
        }
        e.target.value = "";
      };
      reader.readAsText(file);
    });
  }

  if(giornate.length===0){
    $content.innerHTML =
      '<h2 class="section-title dup">Riepilogo</h2>' +
      '<div class="msg-empty">Registra qualche giornata per vedere il riepilogo.</div>' +
      backupSection;
    wireBackupButtons();
    return;
  }

  var mesiSet = {};
  giornate.forEach(function(g){ mesiSet[monthKey(g.data)] = true; });
  var mesi = Object.keys(mesiSet).sort().reverse();

  var filtered = RIEPILOGO_MESE==="tutti" ? giornate : giornate.filter(function(g){ return monthKey(g.data)===RIEPILOGO_MESE; });

  var meseOpts = '<option value="tutti"' + (RIEPILOGO_MESE==="tutti"?' selected':'') + '>Tutti i periodi</option>';
  mesi.forEach(function(m){
    meseOpts += '<option value="' + m + '"' + (RIEPILOGO_MESE===m?' selected':'') + '>' + monthLabel(m) + '</option>';
  });

  // Totali del periodo filtrato
  var periodoCredit = 0, periodoDebit = 0, periodoNonPagato = 0, periodoSpese = 0, periodoCarb = 0, periodoPasti = 0, periodoFurg = 0, periodoInc = 0;
  filtered.forEach(function(g){ periodoCredit += (g.importoCliente||0); periodoDebit += giornoCosti(g); periodoNonPagato += giornoNonPagato(g); periodoSpese += giornoSpese(g); periodoInc += giornoDaIncassare(g); periodoCarb += (g.carburante||0); periodoPasti += (g.pasti||0); periodoFurg += (g.furgone||0); });
  var periodoMargine = periodoCredit - periodoDebit;

  var periodoStrip =
    '<div class="totals-strip" style="margin:0 0 20px;">' +
      '<div class="tot-card credit"><div class="lbl">Da clienti</div><div class="val">&euro; ' + eur(periodoCredit) + '</div></div>' +
      '<div class="tot-card credit"><div class="lbl">Da incassare</div><div class="val">&euro; ' + eur(periodoInc) + '</div></div>' +
      '<div class="tot-card debit"><div class="lbl">Alla squadra</div><div class="val">&euro; ' + eur(periodoDebit) + '</div></div>' +
      '<div class="tot-card debit"><div class="lbl">Da pagare</div><div class="val">&euro; ' + eur(periodoNonPagato) + '</div></div>' +
      '<div class="tot-card margin"><div class="lbl">Margine</div><div class="val">&euro; ' + eur(periodoMargine) + '</div></div>' +
      '<div class="tot-card spese"><div class="lbl">Spese (a parte)</div><div class="val">&euro; ' + eur(periodoSpese) + '</div><div class="spese-sub">carburante &euro; ' + eur(periodoCarb) + ' &middot; pasti &euro; ' + eur(periodoPasti) + ' &middot; furgone &euro; ' + eur(periodoFurg) + '</div></div>' +
    '</div>';

  /* ---- SEZIONE CLIENTI ---- */
  var perCliente = {};
  filtered.forEach(function(g){
    if(!perCliente[g.cliente]) perCliente[g.cliente] = {tot:0, daInc:0, giornate:[]};
    perCliente[g.cliente].tot += (g.importoCliente||0);
    perCliente[g.cliente].daInc += giornoDaIncassare(g);
    perCliente[g.cliente].giornate.push(g);
  });
  var nomiClienti = Object.keys(perCliente).sort();
  var clientiHtml = "";
  if(nomiClienti.length===0){
    clientiHtml = '<div class="msg-empty" style="padding:16px 0;">Nessun dato per questo periodo.</div>';
  } else {
    nomiClienti.forEach(function(nome){
      var info = perCliente[nome];
      var nPersoneGiorno = 0;
      info.giornate.forEach(function(g){ nPersoneGiorno += (g.persone||[]).length; });
      var righeGiorni = info.giornate.slice().sort(function(a,b){ return a.data.localeCompare(b.data); }).map(function(g){
        var nomiPersoneGiorno = (g.persone||[]).map(function(p){ return escapeHtml(p.nome); }).join(", ");
        var pagLblCli = pagamentoLabel(g.pagamentoCliente);
        return '<div class="eline"><span class="d1">' + fmtDateShort(g.data) + ' &middot; ' + (g.persone||[]).length + ' pers. (' + nomiPersoneGiorno + ')' + (pagLblCli ? ' &middot; ' + pagLblCli : '') + '</span>' +
          '<span class="eamt">&euro; ' + eur(g.importoCliente) + '<span class="st ' + (g.incassato ? 'ok' : 'no') + '">' + (g.incassato ? 'Incassato' : 'Da incassare') + '</span></span></div>';
      }).join("");
      var saldoRowCli = '<div class="saldo-row"><div><span>Totale</span><b>&euro; ' + eur(info.tot) + '</b></div>' +
        '<div class="ok"><span>Incassato</span><b>&euro; ' + eur(info.tot - info.daInc) + '</b></div>' +
        '<div class="no"><span>Da incassare</span><b>&euro; ' + eur(info.daInc) + '</b></div></div>';
      var subInc = info.daInc>0
        ? ' &middot; <span style="color:var(--debit);">da incassare &euro; ' + eur(info.daInc) + '</span>'
        : ' &middot; <span style="color:var(--credit);">tutto incassato</span>';
      var btnInc = (info.daInc>0 && RIEPILOGO_MESE!=="tutti")
        ? '<button class="btn-saldo" data-incasso="' + escapeHtml(nome) + '">Segna tutto incassato &middot; &euro; ' + eur(info.daInc) + '</button>'
        : '';
      clientiHtml +=
        '<div class="ledger-entity">' +
          '<div class="ledger-entity-head">' +
            '<div><div class="en-name">' + escapeHtml(nome) + '</div>' +
            '<div class="en-sub">' + info.giornate.length + (info.giornate.length===1?' giornata':' giornate') + ' &middot; ' + nPersoneGiorno + ' persone-giorno' + subInc + '</div><div class="bar"><i style="width:' + (info.tot>0 ? Math.round((info.tot-info.daInc)/info.tot*100) : 0) + '%"></i></div></div>' +
            '<div class="en-amt c">&euro; ' + eur(info.tot) + '</div>' +
          '</div>' +
          '<div class="ledger-entity-body">' + saldoRowCli + righeGiorni + btnInc +
            '<div class="pdf-row"><button class="btn-pdf light" data-pdf="' + escapeHtml(nome) + '" data-det="0">PDF riepilogo</button><button class="btn-pdf" data-pdf="' + escapeHtml(nome) + '" data-det="1">PDF con dettaglio</button></div></div>' +
        '</div>';
    });
  }

  /* ---- SEZIONE PERSONE ---- */
  var perPersona = {};
  filtered.forEach(function(g){
    (g.persone||[]).forEach(function(p){
      if(!perPersona[p.nome]) perPersona[p.nome] = {tot:0, nonPagato:0, giornate:[]};
      perPersona[p.nome].tot += (p.costo||0);
      if(!p.pagato) perPersona[p.nome].nonPagato += (p.costo||0);
      perPersona[p.nome].giornate.push({data:g.data, cliente:g.cliente, costo:p.costo, pagato:!!p.pagato});
    });
  });
  var nomiPersone = Object.keys(perPersona).sort();
  var personeHtml = "";
  if(nomiPersone.length===0){
    personeHtml = '<div class="msg-empty" style="padding:16px 0;">Nessun dato per questo periodo.</div>';
  } else {
    nomiPersone.forEach(function(nome){
      var info = perPersona[nome];
      var perClientePersona = {};
      info.giornate.forEach(function(x){
        if(!perClientePersona[x.cliente]) perClientePersona[x.cliente] = {giorni:0, tot:0, date:[]};
        perClientePersona[x.cliente].giorni += 1;
        perClientePersona[x.cliente].tot += (x.costo||0);
        perClientePersona[x.cliente].date.push(x.data);
      });
      var nomiClientiPersona = Object.keys(perClientePersona).sort();
      var righeClienti = info.giornate.slice().sort(function(a,b){ return a.data.localeCompare(b.data); }).map(function(x){
        return '<div class="eline"><span class="d1">' + fmtDateShort(x.data) + ' &middot; ' + escapeHtml(x.cliente) + '</span>' +
          '<span class="eamt">&euro; ' + eur(x.costo) + '<span class="st ' + (x.pagato ? 'ok' : 'no') + '">' + (x.pagato ? 'Pagato' : 'Da pagare') + '</span></span></div>';
      }).join("");
      var saldoRowPers = '<div class="saldo-row"><div><span>Totale</span><b>&euro; ' + eur(info.tot) + '</b></div>' +
        '<div class="ok"><span>Pagato</span><b>&euro; ' + eur(info.tot - info.nonPagato) + '</b></div>' +
        '<div class="no"><span>Da pagare</span><b>&euro; ' + eur(info.nonPagato) + '</b></div></div>';
      var subPagato = info.nonPagato>0
        ? ' &middot; <span style="color:var(--debit);">da pagare &euro; ' + eur(info.nonPagato) + '</span>'
        : ' &middot; <span style="color:var(--credit);">tutto pagato</span>';
      var btnSaldo = (info.nonPagato>0 && RIEPILOGO_MESE!=="tutti")
        ? '<button class="btn-saldo" data-saldo="' + escapeHtml(nome) + '">Segna tutto pagato &middot; &euro; ' + eur(info.nonPagato) + '</button>'
        : '';
      personeHtml +=
        '<div class="ledger-entity">' +
          '<div class="ledger-entity-head">' +
            '<div><div class="en-name">' + escapeHtml(nome) + '</div>' +
            '<div class="en-sub">' + info.giornate.length + (info.giornate.length===1?' giornata lavorata':' giornate lavorate') + ' &middot; ' + nomiClientiPersona.length + (nomiClientiPersona.length===1?' cliente':' clienti') + subPagato + '</div><div class="bar"><i style="width:' + (info.tot>0 ? Math.round((info.tot-info.nonPagato)/info.tot*100) : 0) + '%"></i></div></div>' +
            '<div class="en-amt d">&euro; ' + eur(info.tot) + '</div>' +
          '</div>' +
          '<div class="ledger-entity-body">' + saldoRowPers + righeClienti + btnSaldo + '<button class="btn-costo" data-costo="' + escapeHtml(nome) + '">Cambia importo per tutte le giornate</button></div>' +
        '</div>';
    });
  }

  /* ---- SEZIONE MARGINE ---- */
  var margineHtml = "";
  if(filtered.length===0){
    margineHtml = '<div class="msg-empty" style="padding:16px 0;">Nessun dato per questo periodo.</div>';
  } else {
    var righeMargine = filtered.slice().sort(function(a,b){ return a.data.localeCompare(b.data); }).map(function(g){
      var m = giornoMargine(g);
      return '<div class="eline"><span class="d1">' + fmtDateShort(g.data) + ' &middot; ' + escapeHtml(g.cliente) + '</span><span style="color:' + (m>=0?'var(--brass)':'var(--debit)') + ';font-weight:600;">&euro; ' + eur(m) + '</span></div>';
    }).join("");
    margineHtml =
      '<div class="ledger-entity">' +
        '<div class="ledger-entity-head">' +
          '<div><div class="en-name">Margine per giornata</div><div class="en-sub">' + filtered.length + ' giornate nel periodo</div></div>' +
          '<div class="en-amt m">&euro; ' + eur(periodoMargine) + '</div>' +
        '</div>' +
        '<div class="ledger-entity-body">' + righeMargine + '</div>' +
      '</div>';
  }

  $content.innerHTML =
    '<h2 class="section-title dup">Riepilogo</h2>' +
    '<div class="sub-title">Totale complessivo</div>' +
    totaliComplessiviHtml() +
    '<div class="sub-title">Periodo</div>' +
    '<div class="filter-row"><select id="f-mese">' + meseOpts + '</select></div>' +
    periodoStrip +
    '<h2 class="section-title">Da incassare &mdash; per cliente <span class="count">' + nomiClienti.length + '</span></h2>' +
    clientiHtml +
    '<h2 class="section-title">Da pagare &mdash; per persona <span class="count">' + nomiPersone.length + '</span></h2>' +
    personeHtml +
    '<h2 class="section-title">Margine &mdash; per giornata</h2>' +
    margineHtml +
    backupSection;

  on(document.getElementById("f-mese"), "change", function(e){ RIEPILOGO_MESE = e.target.value; renderRiepilogo(); });
  document.querySelectorAll(".ledger-entity-head").forEach(function(h){
    on(h, "click", function(){
      var bd = h.nextElementSibling;
      if(bd){ bd.classList.toggle("open"); }
      h.parentNode.classList.toggle("aperto");
    });
  });
  document.querySelectorAll("[data-pdf]").forEach(function(b){
    on(b, "click", function(){
      var nome = b.dataset.pdf, tutti = RIEPILOGO_MESE==="tutti", det = b.dataset.det==="1";
      var lista = giornate.filter(function(g){ return g.cliente===nome && (tutti || monthKey(g.data)===RIEPILOGO_MESE); });
      if(!lista.length) return;
      try{
        var bytes = pdfRiepilogoCliente(nome, lista, tutti ? "Tutti i periodi" : monthLabel(RIEPILOGO_MESE), det);
        var fn = "Riepilogo-" + nome.replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"") + "-" + (tutti ? "completo" : RIEPILOGO_MESE) + (det ? "-dettaglio" : "") + ".pdf";
        pdfCondividi(bytes, fn);
      }catch(e){ reportError(e); }
    });
  });
  document.querySelectorAll("[data-incasso]").forEach(function(b){
    on(b, "click", function(){
      var nome = b.dataset.incasso;
      if(!confirm("Segnare come incassate tutte le giornate di " + nome + " in " + monthLabel(RIEPILOGO_MESE) + "?")) return;
      giornate.forEach(function(g){
        if(g.cliente===nome && monthKey(g.data)===RIEPILOGO_MESE){ g.incassato = true; }
      });
      saveData();
      renderRiepilogo();
      showToast("Incassato \u2713");
    });
  });
  document.querySelectorAll("[data-costo]").forEach(function(b){
    on(b, "click", function(){
      var nome = b.dataset.costo;
      var tutti = RIEPILOGO_MESE==="tutti";
      var periodo = tutti ? "tutti i periodi" : monthLabel(RIEPILOGO_MESE);
      var target = giornate.filter(function(g){
        return (tutti || monthKey(g.data)===RIEPILOGO_MESE) && (g.persone||[]).some(function(p){ return p.nome===nome; });
      });
      if(!target.length) return;
      var r = window.prompt("Nuovo importo (\u20ac) per ogni giornata di " + nome + " in " + periodo + " (" + target.length + " giornate).\n\nScrivi 0 per non contarlo nei costi:", "0");
      if(r===null) return;
      var v = parseFloat(String(r).replace(",", "."));
      if(isNaN(v) || v<0){ showToast("Importo non valido"); return; }
      if(!confirm("Impostare \u20ac " + eur(v) + " a " + nome + " su " + target.length + " giornate (" + periodo + ")?\n\nGli importi attuali verranno sostituiti.")) return;
      target.forEach(function(g){
        (g.persone||[]).forEach(function(p){ if(p.nome===nome){ p.costo = v; } });
      });
      saveData();
      renderRiepilogo();
      showToast("Importi aggiornati \u2713");
    });
  });
  document.querySelectorAll("[data-saldo]").forEach(function(b){
    on(b, "click", function(){
      var nome = b.dataset.saldo;
      if(!confirm("Segnare come pagate tutte le giornate di " + nome + " in " + monthLabel(RIEPILOGO_MESE) + "?")) return;
      giornate.forEach(function(g){
        if(monthKey(g.data)===RIEPILOGO_MESE){
          (g.persone||[]).forEach(function(p){ if(p.nome===nome){ p.pagato = true; } });
        }
      });
      saveData();
      renderRiepilogo();
      showToast("Saldato \u2713");
    });
  });
  wireBackupButtons();
}

/* ---------------- CALENDARIO PROGRAMMAZIONE ---------------- */
var PROG_KEY = "wservice_programma_v1";
var programma = [];
var calMese = todayISO().slice(0,7);
var calGiorno = todayISO();
var progForm = null;
var formDaProgramma = null;
var MESI = ["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];

function loadProg(){ try{ var r = window.localStorage.getItem(PROG_KEY); if(r){ programma = JSON.parse(r) || []; } }catch(e){} }
function saveProg(){ try{ window.localStorage.setItem(PROG_KEY, JSON.stringify(programma)); }catch(e){ showToast("Impossibile salvare il calendario"); } }
function pad2(n){ return ("0"+n).slice(-2); }
function nomiNoti(){
  var m = {};
  giornate.forEach(function(g){ (g.persone||[]).forEach(function(p){ if(p.nome) m[p.nome] = 1; }); });
  programma.forEach(function(j){ (j.persone||[]).forEach(function(n){ m[n] = 1; }); });
  return Object.keys(m).sort();
}
function clientiNoti(){
  var m = {};
  giornate.forEach(function(g){ if(g.cliente) m[g.cliente] = 1; });
  programma.forEach(function(j){ if(j.cliente) m[j.cliente] = 1; });
  return Object.keys(m).sort();
}
function spostaMese(delta){
  var y = parseInt(calMese.slice(0,4),10), m = parseInt(calMese.slice(5,7),10)-1;
  var dt = new Date(y, m+delta, 1);
  calMese = dt.getFullYear() + "-" + pad2(dt.getMonth()+1);
  calGiorno = (calMese === todayISO().slice(0,7)) ? todayISO() : calMese + "-01";
  renderCalendario();
}

function renderCalendario(){
  if(progForm){ renderProgForm(); return; }
  var y = parseInt(calMese.slice(0,4),10), m = parseInt(calMese.slice(5,7),10)-1;
  var offset = (new Date(y,m,1).getDay()+6)%7;
  var nGiorni = new Date(y,m+1,0).getDate();
  var conta = {};
  programma.forEach(function(j){ if(!j.fatto) conta[j.data] = (conta[j.data]||0)+1; });
  var oggi = todayISO();
  var html = '<h2 class="section-title dup">Calendario</h2>' +
    '<div class="cal-nav"><button id="cal-prev">&lsaquo;</button><div class="cal-mese">' + MESI[m] + ' ' + y + '</div><button id="cal-next">&rsaquo;</button></div>' +
    '<div class="cal-grid">';
  ["L","M","M","G","V","S","D"].forEach(function(d){ html += '<div class="cal-dow">' + d + '</div>'; });
  for(var i=0;i<offset;i++){ html += '<div></div>'; }
  for(var d=1; d<=nGiorni; d++){
    var iso = calMese + "-" + pad2(d);
    var n = conta[iso];
    html += '<button class="cal-day' + (iso===calGiorno?' sel':'') + (iso===oggi?' today':'') + '" data-d="' + iso + '">' + d + (n ? '<span class="cal-dot">' + n + '</span>' : '') + '</button>';
  }
  html += '</div>';
  var jobs = programma.filter(function(j){ return j.data===calGiorno; }).sort(function(a,b){ return (a.ora||"").localeCompare(b.ora||""); });
  html += '<h2 class="section-title">' + fmtDate(calGiorno) + '</h2>';
  if(!jobs.length){ html += '<div class="msg-empty" style="padding:12px 0;">Nessun montaggio programmato.</div>'; }
  jobs.forEach(function(j){
    var pers = (j.persone||[]).map(function(n){ return escapeHtml(n); }).join(", ");
    html += '<div class="prog-card' + (j.fatto?' done':'') + '">' +
      '<div class="cli">' + (j.ora ? escapeHtml(j.ora) + ' &middot; ' : '') + escapeHtml(j.cliente) + (j.fatto ? ' <span class="prog-tag">registrato</span>' : '') + '</div>' +
      '<div class="meta">' + (pers || 'Nessuna persona assegnata') + '</div>' +
      (j.note ? '<div class="prog-note">' + escapeHtml(j.note) + '</div>' : '') +
      '<div class="giorno-actions">' +
        (j.fatto ? '' : '<button class="btn-edit" data-reg="' + j.id + '">Registra</button>') +
        '<button class="btn-edit" data-pedit="' + j.id + '">Modifica</button>' +
        '<button class="btn-del" data-pdel="' + j.id + '">Elimina</button>' +
      '</div></div>';
  });
  html += '<button class="btn-primary" id="cal-add">+ Programma montaggio</button>';
  $content.innerHTML = html;

  on(document.getElementById("cal-prev"), "click", function(){ spostaMese(-1); });
  on(document.getElementById("cal-next"), "click", function(){ spostaMese(1); });
  document.querySelectorAll(".cal-day").forEach(function(b){
    on(b, "click", function(){ calGiorno = b.dataset.d; renderCalendario(); });
  });
  on(document.getElementById("cal-add"), "click", function(){
    progForm = {id:null, data:calGiorno, ora:"", cliente:"", persone:[], note:"", fatto:false};
    renderCalendario();
  });
  function trova(id){ return programma.find(function(x){ return x.id===id; }); }
  document.querySelectorAll("[data-pedit]").forEach(function(b){
    on(b, "click", function(){
      var j = trova(b.dataset.pedit); if(!j) return;
      progForm = {id:j.id, data:j.data, ora:j.ora||"", cliente:j.cliente, persone:(j.persone||[]).slice(), note:j.note||"", fatto:!!j.fatto};
      renderCalendario();
    });
  });
  document.querySelectorAll("[data-pdel]").forEach(function(b){
    on(b, "click", function(){
      if(!confirm("Eliminare questo montaggio dal calendario?")) return;
      programma = programma.filter(function(x){ return x.id!==b.dataset.pdel; });
      saveProg(); renderCalendario();
    });
  });
  document.querySelectorAll("[data-reg]").forEach(function(b){
    on(b, "click", function(){
      var j = trova(b.dataset.reg); if(!j) return;
      editingId = null;
      formData = j.data; formCliente = j.cliente; formImporto = ""; formNote = j.note || ""; formCarb = ""; formPasti = ""; formFurg = ""; formIncassato = false; formPagamento = "";
      formPersone = (j.persone||[]).map(function(n){ return {nome:n, costo:"", pagato:false}; });
      if(formPersone.length===0){ formPersone = [{nome:"", costo:"", pagato:false}]; }
      formDaProgramma = j.id;
      renderTab("nuova");
      showToast("Inserisci importo e costi, poi registra");
    });
  });
}

/* ---------------- ELENCO PERSONE (SQUADRA) ---------------- */
var SQ_KEY = "wservice_squadra_v1";
var squadra = [];
function saveSq(){ try{ window.localStorage.setItem(SQ_KEY, JSON.stringify(squadra)); }catch(e){} }
function loadSq(){
  var r = null;
  try{ r = window.localStorage.getItem(SQ_KEY); }catch(e){}
  if(r !== null){ try{ squadra = JSON.parse(r) || []; }catch(e){ squadra = []; } return; }
  var m = {};
  giornate.forEach(function(g){ (g.persone||[]).forEach(function(p){ if(p.nome) m[p.nome] = 1; }); });
  programma.forEach(function(j){ (j.persone||[]).forEach(function(n){ m[n] = 1; }); });
  squadra = Object.keys(m).sort(function(a,b){ return a.localeCompare(b); });
  saveSq();
}
function sqAggiungi(n){
  n = (n||"").trim(); if(!n) return "";
  var e = squadra.filter(function(x){ return x.toLowerCase()===n.toLowerCase(); })[0];
  if(e) return e;
  squadra.push(n);
  squadra.sort(function(a,b){ return a.localeCompare(b); });
  saveSq();
  return n;
}
function sqRimuovi(n){ squadra = squadra.filter(function(x){ return x!==n; }); saveSq(); }

function progLeggi(){
  var f = progForm;
  f.data = document.getElementById("p-data").value;
  f.ora = document.getElementById("p-ora").value;
  f.cliente = document.getElementById("p-cliente").value;
  f.note = document.getElementById("p-note").value;
  f.persone = [];
  document.querySelectorAll(".p-chk").forEach(function(c){ if(c.checked){ f.persone.push(c.value); } });
}

function renderProgForm(){
  var f = progForm;
  var elenco = squadra.slice();
  f.persone.forEach(function(n){ if(elenco.indexOf(n)<0){ elenco.push(n); } });
  var chk = elenco.map(function(n){
    return '<div class="sq-row"><label class="chk-row"><input type="checkbox" class="p-chk" value="' + escapeHtml(n) + '"' + (f.persone.indexOf(n)>=0 ? ' checked' : '') + '> ' + escapeHtml(n) + '</label>' +
      '<button class="sq-rm" data-sqrm="' + escapeHtml(n) + '" title="Togli dall\'elenco">&times;</button></div>';
  }).join("");
  $content.innerHTML =
    '<h2 class="section-title">' + (f.id ? 'Modifica montaggio' : 'Nuovo montaggio') + '</h2>' +
    '<label>Data</label><input type="date" id="p-data" value="' + escapeHtml(f.data) + '">' +
    '<label>Ora (facoltativa)</label><input type="time" id="p-ora" value="' + escapeHtml(f.ora||"") + '">' +
    '<label>Cliente</label><input type="text" id="p-cliente" list="p-clienti" autocomplete="off" autocapitalize="words" value="' + escapeHtml(f.cliente||"") + '">' +
    '<datalist id="p-clienti">' + clientiNoti().map(function(c){ return '<option value="' + escapeHtml(c) + '">'; }).join("") + '</datalist>' +
    '<label>Persone della squadra</label>' + (chk || '<div class="persona-hint" style="text-align:left;">Elenco vuoto: aggiungi una persona qui sotto.</div>') +
    '<label>Aggiungi una persona all\'elenco</label>' +
    '<div class="sq-add"><input type="text" id="p-altre" autocapitalize="words" placeholder="Nome e cognome"><button class="sq-addbtn" id="p-add">Aggiungi</button></div>' +
    '<label>Note / indirizzo</label><input type="text" id="p-note" value="' + escapeHtml(f.note||"") + '">' +
    '<button class="btn-primary" id="p-salva">Salva montaggio</button>' +
    '<button class="btn-secondary" id="p-annulla">Annulla</button>';

  on(document.getElementById("p-annulla"), "click", function(){ progForm = null; renderCalendario(); });
  on(document.getElementById("p-add"), "click", function(){
    var n = document.getElementById("p-altre").value.trim();
    if(!n){ showToast("Scrivi il nome da aggiungere"); return; }
    progLeggi();
    n = sqAggiungi(n);
    if(f.persone.indexOf(n)<0){ f.persone.push(n); }
    renderProgForm();
  });
  document.querySelectorAll("[data-sqrm]").forEach(function(b){
    on(b, "click", function(){
      var n = b.dataset.sqrm;
      if(!confirm("Togliere " + n + " dall'elenco?\n\nLe giornate già registrate non cambiano.")) return;
      progLeggi();
      sqRimuovi(n);
      f.persone = f.persone.filter(function(x){ return x!==n; });
      renderProgForm();
    });
  });
  on(document.getElementById("p-salva"), "click", function(){
    progLeggi();
    var extra = document.getElementById("p-altre").value.trim();
    if(extra){ var nn = sqAggiungi(extra); if(f.persone.indexOf(nn)<0){ f.persone.push(nn); } }
    if(!f.data || !f.cliente.trim()){ showToast("Inserisci data e cliente"); return; }
    var persone = f.persone.slice();
    var occupati = [];
    programma.forEach(function(o){
      if(o.id!==f.id && !o.fatto && o.data===f.data){
        (o.persone||[]).forEach(function(n){ if(persone.indexOf(n)>=0 && occupati.indexOf(n)<0){ occupati.push(n); } });
      }
    });
    if(occupati.length && !confirm(occupati.join(", ") + " ha già un altro montaggio in quella data.\n\nSalvare comunque?")){ return; }
    var job = {id: f.id || uid(), data:f.data, ora:f.ora, cliente:f.cliente.trim(), persone:persone, note:f.note.trim(), fatto:!!f.fatto};
    if(f.id){
      var ix = programma.findIndex(function(x){ return x.id===f.id; });
      if(ix>=0){ programma[ix] = job; } else { programma.push(job); }
    } else { programma.push(job); }
    saveProg();
    calGiorno = job.data; calMese = job.data.slice(0,7); progForm = null;
    showToast("Montaggio salvato \u2713");
    renderCalendario();
  });
}

var AZ_KEY = "wservice_azienda_v1";
var AZ_DEFAULT = ["Ragione sociale","Partita IVA","Codice fiscale","Codice SDI","PEC","Email","Telefono","Indirizzo sede","IBAN","Codice ATECO","Numero REA"];
var azienda = [];
var azEdit = false;

function loadAz(){
  try{ var r = window.localStorage.getItem(AZ_KEY); if(r){ azienda = JSON.parse(r) || []; } }catch(e){}
  if(!azienda.length){ azienda = AZ_DEFAULT.map(function(l){ return {l:l, v:""}; }); }
}
function saveAz(){ try{ window.localStorage.setItem(AZ_KEY, JSON.stringify(azienda)); }catch(e){ showToast("Impossibile salvare i dati"); } }
function copiaFallback(t){
  var a = document.createElement("textarea");
  a.value = t; a.style.position = "fixed"; a.style.opacity = "0";
  document.body.appendChild(a); a.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(a);
}
function copiaTesto(t){
  var fine = function(){ showToast("Copiato \u2713"); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(fine).catch(function(){ copiaFallback(t); fine(); });
  } else { copiaFallback(t); fine(); }
}
function azLeggi(){
  var ls = document.querySelectorAll(".az-l"), vs = document.querySelectorAll(".az-v");
  azienda = [];
  for(var i=0;i<ls.length;i++){ azienda.push({l:ls[i].value.trim(), v:vs[i].value.trim()}); }
}

function renderAzienda(){
  if(azEdit){
    var rows = azienda.map(function(r,i){
      return '<div class="az-edit"><input type="text" class="az-l" placeholder="Voce" value="' + escapeHtml(r.l) + '">' +
        '<input type="text" class="az-v" placeholder="Valore" autocapitalize="off" value="' + escapeHtml(r.v) + '">' +
        '<button class="az-rm" data-azrm="' + i + '">&times;</button></div>';
    }).join("");
    $content.innerHTML =
      '<h2 class="section-title">Modifica dati azienda</h2>' + rows +
      '<button class="btn-secondary" id="az-add">+ Aggiungi voce</button>' +
      '<button class="btn-primary" id="az-salva">Salva</button>' +
      '<button class="btn-cancel" id="az-annulla">Annulla</button>';
    on(document.getElementById("az-add"), "click", function(){ azLeggi(); azienda.push({l:"",v:""}); renderAzienda(); });
    document.querySelectorAll("[data-azrm]").forEach(function(b){
      on(b, "click", function(){ azLeggi(); azienda.splice(parseInt(b.dataset.azrm,10),1); renderAzienda(); });
    });
    on(document.getElementById("az-salva"), "click", function(){
      azLeggi();
      azienda = azienda.filter(function(r){ return r.l || r.v; });
      saveAz(); azEdit = false; showToast("Dati salvati \u2713"); renderAzienda();
    });
    on(document.getElementById("az-annulla"), "click", function(){ loadAz(); azEdit = false; renderAzienda(); });
    return;
  }
  var piene = azienda.map(function(r,i){ return {r:r,i:i}; }).filter(function(x){ return x.r.v; });
  var righe = piene.map(function(x){
    return '<div class="az-row"><div class="az-txt"><div class="az-lbl">' + escapeHtml(x.r.l) + '</div><div class="az-val">' + escapeHtml(x.r.v) + '</div></div>' +
      '<button class="az-copy" data-az="' + x.i + '">Copia</button></div>';
  }).join("");
  $content.innerHTML =
    '<h2 class="section-title dup">Dati azienda</h2>' +
    (righe ? '<div class="az-card">' + righe + '</div>' : '<div class="msg-empty">Nessun dato inserito.<br>Tocca Modifica per aggiungere partita IVA, codici e contatti.</div>') +
    (righe ? '<button class="btn-secondary" id="az-all">Copia tutto</button>' : '') +
    '<button class="btn-primary" id="az-mod">Modifica dati</button>';
  document.querySelectorAll("[data-az]").forEach(function(b){
    on(b, "click", function(){ copiaTesto(azienda[parseInt(b.dataset.az,10)].v); });
  });
  var btnAll = document.getElementById("az-all");
  if(btnAll){
    on(btnAll, "click", function(){
      copiaTesto(piene.map(function(x){ return x.r.l + ": " + x.r.v; }).join("\n"));
    });
  }
  on(document.getElementById("az-mod"), "click", function(){ azEdit = true; renderAzienda(); });
}

    pdfText(p,40,826,"Allegato alla fattura \u00b7 riepilogo non avente valore fiscale",8,{color:PDF_GREY});
    pdfText(p,555,826,"Pagina " + (i+1) + " di " + pages.length,8,{color:PDF_GREY,align:"r"});
    if(i>0){ pdfText(p,40,38,"Riepilogo lavori \u00b7 " + pdfFit(cliente,10,true,300) + " \u00b7 " + periodo,10,{bold:true}); }
  });
  return pdfBuild(pages);
}

function pdfScarica(bytes,nome){
  var blob = new Blob([bytes], {type:"application/pdf"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = nome;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}
function pdfCondividi(bytes,nome){
  try{
    var file = new File([bytes], nome, {type:"application/pdf"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({files:[file], title:nome}).catch(function(e){ if(e && e.name!=="AbortError"){ pdfScarica(bytes,nome); } });
      return;
    }
  }catch(e){}
  pdfScarica(bytes,nome);
}

/* ---------------- TAB SWITCH ---------------- */
function renderTab(tab){
  CURRENT_TAB = tab;
  var titoli = {calendario:"Calendario", nuova:"Nuova giornata", giornate:"Giornate", riepilogo:"Riepilogo", azienda:"Azienda"};
  var h1 = document.querySelector("header.top h1");
  if(h1){ h1.textContent = titoli[tab] || "Registro Giornate"; }
  document.querySelectorAll("nav.tabbar button").forEach(function(b){
    b.classList.toggle("active", b.dataset.tab===tab);
  });
  renderTotalsStrip();
  if(tab==="nuova") renderNuova();
  else if(tab==="giornate") renderGiornate();
  else if(tab==="riepilogo") renderRiepilogo();
  else if(tab==="calendario") renderCalendario();
  else if(tab==="azienda") renderAzienda();
}

document.querySelectorAll("nav.tabbar button").forEach(function(b){
  on(b, "click", function(){ renderTab(b.dataset.tab); });
});

var errBanner = document.getElementById("error-banner");
if(errBanner){
  errBanner.addEventListener("click", function(){ errBanner.style.display = "none"; });
}
window.addEventListener("error", function(e){
  if(e && e.message==="Script error." && !e.error && !e.lineno){
    console.warn("Errore generico senza dettagli (ignorato):", e);
    return;
  }
  if(e && e.error){ reportError(e.error); return; }
  reportError({message:(e && e.message ? e.message : "errore sconosciuto") + (e && e.lineno ? " (riga " + e.lineno + ")" : "")});
});
window.addEventListener("unhandledrejection", function(e){
  reportError(e && e.reason ? e.reason : "operazione non riuscita");
});

try{
  resetForm();
  loadData();
  loadProg();
  loadAz();
  loadSq();
  renderTab("calendario");
  cloudInit();
  try{
    var lb = window.localStorage.getItem(BACKUP_KEY);
    var giorniDa = lb ? Math.floor((Date.now()-new Date(lb+"T12:00:00").getTime())/86400000) : 999;
    if(giornate.length>0 && giorniDa>=14){
      setTimeout(function(){ showToast("Fai un backup: Riepilogo > Esporta backup"); }, 1500);
    }
  }catch(e){}
  if(!storageOk){
    showToast("Salvataggio non disponibile: i dati resteranno solo per questa sessione");
  }
}catch(err){
  reportError(err);
}
